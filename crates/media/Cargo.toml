[package]
name = "lumepeer-media"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = []
# Phase 2 pulls in the real capture/encode backends. Kept behind features so
# that `cargo build --workspace` in phase 0 needs no platform SDKs.
capture-scap = ["dep:scap"]
capture-x11 = ["dep:x11rb"]
# xdg-desktop-portal negotiation and PipeWire frame consumption for the
# Wayland path (§11).
capture-portal = ["dep:ashpd", "dep:tokio", "dep:pipewire"]
encode-openh264 = ["dep:openh264"]
# The decoder worker links openh264 itself; this only affects the media crate.
decode-openh264 = ["dep:openh264"]

[dependencies]
lumepeer-core.workspace = true
iroh-base.workspace = true
blake3.workspace = true
memmap2.workspace = true
tokio = { workspace = true, optional = true }
thiserror.workspace = true
tracing.workspace = true
scap = { workspace = true, optional = true }
openh264 = { workspace = true, optional = true }

[target.'cfg(all(target_os = "linux", not(target_os = "android")))'.dependencies]
ashpd = { version = "0.13.13", default-features = false, features = [
    "tokio",
    "screencast",
    "remote_desktop",
], optional = true }
x11rb = { workspace = true, optional = true, features = ["xtest"] }
pipewire = { version = "0.8", optional = true }

# §11.3's Windows decoder sandbox (`decode::windows_sandbox`): AppContainer
# can only be applied at process creation, so the worker is launched by hand
# through `CreateProcessW` rather than `std::process::Command`. Version
# 0.61.3 matches what `apps/desktop/src-tauri`'s dependency tree (tauri,
# webview2-com, tao) already resolves to, so this does not add a second
# `windows` major version to the workspace (checked against Cargo.lock).
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61.3", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Isolation",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }
