[package]
name = "lumepeer-media"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = []
# Phase 2 pulls in the real capture/encode backends. Kept behind features so
# that `cargo build --workspace` in phase 0 needs no platform SDKs.
capture-scap = ["dep:scap"]
capture-x11 = ["dep:x11rb"]
# ScreenCaptureKit capture for macOS (§11, §5.1; ADR 0013). Kept behind a
# feature, exactly like capture-x11 above, so `cargo build --workspace` needs
# no platform SDK by default. The objc2 framework bindings it pulls in are
# declared optional in the macOS target table below, so this feature is inert
# (and the deps are never built) on every other platform.
capture-screencapturekit = [
    "dep:objc2",
    "dep:objc2-foundation",
    "dep:objc2-core-foundation",
    "dep:objc2-core-graphics",
    "dep:objc2-core-media",
    "dep:objc2-core-video",
    "dep:objc2-screen-capture-kit",
    "dep:block2",
    "dep:dispatch2",
]
# ScreenCaptureKit desktop-audio capture for macOS (§11; docs/gap-tasks/
# 01-macos-monitors-and-audio-capture.md). `SCStreamConfiguration.
# capturesAudio(true)` on a dedicated stream hands back the desktop output
# mix directly, so this needs no virtual output device and no CoreAudio
# loopback. Lives inside the `capture-screencapturekit` module and reuses its
# delegate, so it requires that feature rather than duplicating any of it.
# Reading the delivered `AudioBufferList`/`AudioStreamBasicDescription` needs
# the CoreAudioTypes struct layouts, which `objc2-core-media` already
# resolves through its own optional `objc2-core-audio-types` dependency (see
# Cargo.lock) at the same 0.3.2 the rest of the objc2 framework family here
# is pinned to — enabling it adds no new objc2 major version, matching the
# reasoning `capture-screencapturekit` above already documents.
audio-capture-screencapturekit = [
    "capture-screencapturekit",
    "dep:objc2-core-audio-types",
    "objc2-core-media/CMFormatDescription",
    "objc2-core-media/CMBlockBuffer",
    "objc2-core-media/objc2-core-audio-types",
]
# CoreAudio `AudioQueue` desktop-audio playout for macOS (§11; ADR 0028;
# docs/gap-tasks/02-macos-audio-playout.md). Independent of
# `audio-capture-screencapturekit`: playback shares none of ScreenCaptureKit's
# plumbing, so this is its own feature rather than folded into that one, the
# same way `audio-capture`/`audio-capture-pipewire` are their own features
# next to `capture-windows`/`capture-portal`. `objc2-core-audio` (the
# CoreAudio HAL) is already resolved at this exact version through
# `objc2-core-media`'s own dependency tree (see the
# `audio-capture-screencapturekit` comment above and Cargo.lock), so adding
# it as a direct dependency here is not a new objc2 major version.
# `objc2-audio-toolbox` (the `AudioQueue` API itself) is genuinely new to
# this workspace, pinned at that same 0.3.2 the rest of the objc2 framework
# family here already uses.
audio-playout-coreaudio = [
    "dep:objc2-audio-toolbox",
    "dep:objc2-core-audio",
    "dep:objc2-core-audio-types",
]
# xdg-desktop-portal negotiation and PipeWire frame consumption for the
# Wayland path (§11).
capture-portal = ["dep:ashpd", "dep:tokio", "dep:pipewire"]
encode-openh264 = ["dep:openh264"]
# VA-API hardware H.264 encoder for Linux (§5.1, §11, §18/§19 phase 4; ADR
# 0031). Same convention as encode-mf: `cargo build --workspace` needs no
# platform SDK, and `cros-libva` is declared optional in the Linux target
# table so the feature is inert everywhere else. Deliberately NOT part of the
# shipped Linux feature set: a .deb must install and run on a machine with no
# VA-API at all, falling back to openh264 (§18).
encode-vaapi = ["dep:cros-libva"]
# Hardware H.265/HEVC encoding (§11; ADR 0071). Off by default and off in
# every row of the release matrix, and that is a **licensing** decision rather
# than a technical one: H.265 is covered by the Access Advance and Via LA
# patent pools, and this project ships an installer. Turning this on for a
# distributed build is a decision for a human with the authority to take it —
# see ADR 0071.
#
# A pure marker feature: it adds no dependency, because neither backend needs
# one. On Windows it selects `MFVideoFormat_HEVC` inside the `encode-mf`
# module, whose `windows` bindings already carry it; on Linux it enables the
# HEVC parameter buffers inside the `encode-vaapi` module, whose `cros-libva`
# already carries those too. Without a platform encoder feature next to it,
# this feature is completely inert: every probe answers `None` and the
# negotiation never offers H.265 at all.
encode-h265 = []
# VideoToolbox hardware H.264 encoder for macOS (§5.1, §11, §18/§19 phase 4;
# ADR 0066). Same convention as encode-mf/encode-vaapi: `cargo build
# --workspace` needs no platform SDK, and every binding it needs is declared
# optional in the macOS target table below, so the feature is inert (and the
# crates are never built) on every other platform. It names the objc2
# framework crates it uses itself rather than free-riding on
# capture-screencapturekit's list, so a build that wants the encoder without
# ScreenCaptureKit still gets them. Ships *alongside* encode-openh264 on
# macOS, never instead of it: a Mac whose probe declines has to keep running
# on the software fallback (§18).
encode-videotoolbox = [
    "dep:objc2-core-foundation",
    "dep:objc2-core-media",
    "dep:objc2-core-video",
    "dep:objc2-video-toolbox",
]
# Opus audio encode/decode (§5.1; ADR 0023). audiopus_sys vendors libopus and
# builds it with cmake — the same precedent as openh264-sys — so the default
# build still needs no platform SDK. Without this feature every audio entry
# point is inert and the session runs video-only.
audio-opus = ["dep:opus"]
# Desktop-audio capture backends (§11; questions.md item 8, ADR 0023): WASAPI
# loopback on Windows. The `windows` crate itself is already unconditional on
# Windows (see below), so this feature only adds the WASAPI/COM binding
# modules the capturer needs on top of what the decoder sandbox requires.
audio-capture = ["windows/Win32_Media_Audio"]
# PipeWire desktop-audio capture and playback on Linux (questions.md item 8,
# ADR 0023). Reuses the same `pipewire` binding set `capture-portal` pulls in
# rather than adding a second one — but names it as its own dependency, so a
# build that wants Linux audio without the Wayland capture path still gets the
# crate. Declaring nothing here and free-riding on `capture-portal` is what
# made this feature unbuildable on its own.
audio-capture-pipewire = ["dep:pipewire"]
# The decoder worker links openh264 itself; this only affects the media crate.
decode-openh264 = ["dep:openh264"]
# Windows Media Foundation hardware H.264 encoder MFT (§5.1, §11, §18/§19
# phase 4; ADR 0011). Kept behind a feature, matching capture-x11/
# encode-openh264, so `cargo build --workspace` needs no platform SDK. The
# `windows` crate itself is not optional (the AppContainer decoder sandbox
# of `decode::windows_sandbox` needs it unconditionally on Windows - see
# below), so this feature only gates the encoder module itself.
# `Win32_System_Ole` is what gates `ICodecAPI::SetValue` in the `windows`
# bindings, and that is how `VideoEncoder::request_keyframe` asks a hardware
# MFT for an IDR (`CODECAPI_AVEncVideoForceKeyFrame`, §11).
encode-mf = ["windows/Win32_System_Ole"]
# DXGI Desktop Duplication screen capture (§11, §18; ADR 0012). Same
# convention as capture-x11/encode-mf above, so `cargo build --workspace`
# needs no platform SDK and pulls in no extra bindings. The `windows` crate
# itself is not optional on Windows (see below), so this feature only adds the
# Direct3D 11/DXGI binding modules the capturer needs on top of what the
# decoder sandbox and the encoder already require.
capture-windows = [
    "windows/Win32_Graphics_Direct3D",
    "windows/Win32_Graphics_Direct3D11",
    "windows/Win32_Graphics_Dxgi",
    "windows/Win32_Graphics_Dxgi_Common",
    "windows/Win32_Graphics_Gdi",
    "windows/Win32_UI_Input_KeyboardAndMouse",
    # `GetCursorPos`/`GetSystemMetrics`, which is how the injector notices
    # that an absolute move did not land and switches to relative motion
    # (docs/bugs/17-remote-hotkeys.md).
    "windows/Win32_UI_WindowsAndMessaging",
]

[dependencies]
lumepeer-core.workspace = true
iroh-base.workspace = true
blake3.workspace = true
memmap2.workspace = true
tokio = { workspace = true, optional = true }
thiserror.workspace = true
tracing.workspace = true
scap = { workspace = true, optional = true }
openh264 = { workspace = true, optional = true }
opus = { workspace = true, optional = true }

[target.'cfg(all(target_os = "linux", not(target_os = "android")))'.dependencies]
ashpd = { version = "0.13.13", default-features = false, features = [
    "tokio",
    "screencast",
    "remote_desktop",
], optional = true }
# `xfixes` is what makes the pointer visible: X11's `GetImage` never contains
# it, so without the extension an X11 host shares a screen with no cursor at
# all (§11). `randr` is what makes a second monitor visible: a multi-head X
# display is one X screen spanning every head, so `setup.roots` reports one
# monitor on a three-monitor machine and RandR 1.5's `GetMonitors` is the
# request that reports the heads themselves (ADR 0028).
x11rb = { workspace = true, optional = true, features = [
    "xtest",
    "xfixes",
    "randr",
] }
pipewire = { version = "0.8", optional = true }
# Safe libva bindings for the VA-API encoder (ADR 0040). BSD-3-Clause, which
# `deny.toml`'s allowlist already carries. Intel and AMD only by design:
# NVIDIA encode is NVENC, a separate SDK under separate terms, and is a
# deliberately separate decision.
cros-libva = { version = "0.0.13", optional = true }

# ScreenCaptureKit and the CoreMedia/CoreVideo types it hands frames back in
# (§11, ADR 0013), all optional and pulled in only by
# `capture-screencapturekit`. These are the `objc2` framework bindings, not a
# second Apple-interop ecosystem: the versions below are the ones
# `apps/desktop/src-tauri`'s dependency tree (tauri, tao, objc2-app-kit)
# already resolves to, checked against Cargo.lock, so enabling the feature
# adds three framework crates rather than a duplicate objc2 major version.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6.4", optional = true }
objc2-core-foundation = { version = "0.3.2", optional = true, default-features = false, features = [
    "std",
    "CFCGTypes",
    # The three CF types `encode-videotoolbox` talks to VideoToolbox with:
    # property keys are `CFString`s, their values `CFNumber`s and
    # `CFBoolean`s (`CFNumber`), and `kVTEncodeFrameOptionKey_ForceKeyFrame`
    # travels in a `CFDictionary` of per-frame options.
    "CFDictionary",
    "CFNumber",
    "CFString",
] }
objc2-foundation = { version = "0.3.2", optional = true, default-features = false, features = [
    "std",
    "NSArray",
    "NSEnumerator",
    "NSError",
    "NSString",
] }
objc2-core-graphics = { version = "0.3.2", optional = true, default-features = false, features = [
    "std",
    "CGDirectDisplay",
    "CGEvent",
    "CGEventTypes",
    "CGRemoteOperation",
] }
objc2-core-media = { version = "0.3.2", optional = true, default-features = false, features = [
    "std",
    "CMBase",
    "CMSampleBuffer",
    "CMTime",
    "objc2-core-video",
    # `encode-videotoolbox` reads a compressed sample's bytes out of its
    # `CMBlockBuffer` and its SPS/PPS out of its `CMFormatDescription` —
    # VideoToolbox keeps the parameter sets there rather than in the
    # bitstream, so without this a guest never sees an SPS.
    "CMBlockBuffer",
    "CMFormatDescription",
] }
objc2-core-video = { version = "0.3.2", optional = true, default-features = false, features = [
    "std",
    "CVBase",
    "CVBuffer",
    "CVImageBuffer",
    "CVPixelBuffer",
    "CVReturn",
] }
objc2-screen-capture-kit = { version = "0.3.2", optional = true, default-features = false, features = [
    "std",
    "SCStream",
    "SCShareableContent",
    "block2",
    "dispatch2",
    "objc2-core-graphics",
    "objc2-core-media",
] }
# The VideoToolbox compression session itself (ADR 0066), pulled in only by
# `encode-videotoolbox`. Same objc2 0.3.2 framework-binding family, and the
# same pinned version, as the ScreenCaptureKit crates above, so enabling the
# encoder adds one framework crate rather than a second objc2 generation.
# `objc2` interop is deliberately not enabled: nothing here is an
# Objective-C object, only CoreFoundation types.
objc2-video-toolbox = { version = "0.3.2", optional = true, default-features = false, features = [
    "std",
    "VTBase",
    "VTErrors",
    "VTSession",
    "VTCompressionProperties",
    "VTCompressionSession",
    "objc2-core-media",
    "objc2-core-video",
] }
block2 = { version = "0.6.2", optional = true }
dispatch2 = { version = "0.3.1", optional = true, default-features = false, features = [
    "std",
    "objc2",
] }
# AudioBufferList/AudioStreamBasicDescription for reading a ScreenCaptureKit
# audio sample buffer's PCM data and format (audio-capture-screencapturekit).
# Already resolved at this exact version through objc2-core-media's own
# dependency tree (checked against Cargo.lock), so this is a direct edge onto
# a crate already in the graph, not a new objc2 version.
objc2-core-audio-types = { version = "0.3.2", optional = true, default-features = false, features = [
    "std",
    "CoreAudioBaseTypes",
] }
# CoreAudio HAL (`AudioObjectGetPropertyData`,
# `kAudioHardwarePropertyDefaultOutputDevice`) for reading the default output
# device's real nominal sample rate before opening it (audio-playout-
# coreaudio; docs/gap-tasks/02-macos-audio-playout.md) — the same "ask, don't
# assume" discipline `WasapiPlayout::start`'s `GetMixFormat` call and
# `capture_audio::linux_pipewire`'s negotiated-format handling both follow.
# Already resolved at this exact version through objc2-core-media's own
# dependency tree (checked against Cargo.lock), so this is a direct edge onto
# a crate already in the graph, not a new objc2 version — the same reasoning
# objc2-core-audio-types above documents.
objc2-core-audio = { version = "0.3.2", optional = true, default-features = false, features = [
    "std",
    "AudioHardware",
] }
# `AudioQueue` (AudioToolbox framework) itself: the playback engine
# audio-playout-coreaudio opens against the default output device. Needs its
# own `objc2-core-audio-types` (AudioQueueBuffer/AudioStreamBasicDescription)
# and `objc2-core-foundation` (the run-loop parameters `AudioQueueNewOutput`
# takes) sub-features; both crates are already in this table above at the
# same version, so this adds no new objc2 major version either — genuinely
# new is only the `objc2-audio-toolbox` crate itself.
objc2-audio-toolbox = { version = "0.3.2", optional = true, default-features = false, features = [
    "std",
    "AudioQueue",
    "objc2-core-audio-types",
    "objc2-core-foundation",
] }

# Used unconditionally on Windows (not gated by a Cargo feature): §11.3's
# `decode::windows_sandbox` needs it for the AppContainer decoder sandbox
# regardless of which encoder feature is built, and the `encode-mf` hardware
# encoder (ADR 0011) reuses the same dependency rather than pulling in a
# second `windows` major version. AppContainer can only be applied at
# process creation, so the worker is launched by hand through
# `CreateProcessW` rather than `std::process::Command`. Version 0.61.3
# matches what `apps/desktop/src-tauri`'s dependency tree (tauri,
# webview2-com, tao) already resolves to (checked against Cargo.lock).
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61.3", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_MediaFoundation",
    "Win32_Security",
    "Win32_Security_Authentication_Identity",
    "Win32_Security_Isolation",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    # IMMDevice::Activate is feature-gated behind BOTH
    # Win32::System::Com::StructuredStorage and Win32::System::Variant (its
    # PROPVARIANT parameter); without them the method is compiled out of the
    # `windows` bindings and the WASAPI capturer fails with E0599 when the
    # crate builds outside the full workspace feature unification.
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
] }
