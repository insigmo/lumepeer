[package]
name = "lumepeer-guestkeys"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true
description = "Lumepeer guest-side keyboard: the keys a webview never sees (ADR 0090)"

[lints]
workspace = true

[features]
# The hook takes injected keystrokes that carry the e2e matrix's mark
# (e2e/matrix/agent.py), so a test can press a chord the hook sees. Enabled
# only by the desktop app's `pilot` feature, and inert without
# `debug_assertions` like the rest of pilot.
e2e = []

[dependencies]
lumepeer-core.workspace = true
tracing.workspace = true

# The low-level keyboard hook and the WebView2 setting, neither of which has a
# safe binding: `SetWindowsHookExW` is raw FFI and every `ICoreWebView2*` call
# is a `unsafe fn` COM method. Same `windows` version the rest of the
# workspace resolves to, so no second `windows` tree appears.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61.3", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
# `ICoreWebView2Settings3`, the interface that carries
# `AreBrowserAcceleratorKeysEnabled`. The exact crate — and version — Tauri's
# own `PlatformWebview::controller()` hands back, so this is a new edge onto a
# dependency the desktop app already links, not a new dependency.
webview2-com = "0.38"
windows-core = "0.61"
