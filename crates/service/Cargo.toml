[package]
name = "lumepeer-service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true
description = "Lumepeer privileged helper service (ADR 0043)"

[[bin]]
name = "lumepeer-service"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
# The per-store secret of `program_data::keystore_secret` (ADR 0123).
rand.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# The Linux sign-in screen's supervisor (ADR 0151): who is on the other end of
# the enrolment socket (`SO_PEERCRED`), its own euid, and a `SIGTERM` to the
# logon host — all safe wrappers, so this side keeps `forbid(unsafe_code)`.
# Already in the tree at this version.
[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1.4", features = ["net", "process"] }

# Raw Win32: a Windows service has no safe entry point — `StartServiceCtrl
# DispatcherW` is the only way a process becomes one — and a named pipe with a
# restrictive DACL has no safe binding either. Same major version the rest of
# the workspace already resolves to, so no second `windows` tree appears.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61.3", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authentication_Identity",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Environment",
    "Win32_System_IO",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_Power",
    "Win32_System_RemoteDesktop",
    "Win32_System_Services",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
