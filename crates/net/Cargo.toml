[package]
name = "lumepeer-net"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
lumepeer-core.workspace = true
iroh.workspace = true
tokio.workspace = true
serde.workspace = true
serde-big-array.workspace = true
postcard.workspace = true
ed25519-dalek.workspace = true
blake3.workspace = true
rand.workspace = true
data-encoding.workspace = true
chacha20poly1305.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
proptest.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
# Only for the `wan_probe` example, which needs iroh's own logs to explain a
# failed relay connection.
tracing-subscriber.workspace = true

[target.'cfg(all(target_os = "linux", not(target_os = "android")))'.dependencies]
secret-service = { version = "5.1.0", features = ["rt-tokio-crypto-rust"], optional = true }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
security-framework = "3"
security-framework-sys = "2"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"], optional = true }

[features]
secret-service = ["dep:secret-service"]
keyring = ["dep:keyring"]
