[package]
name = "lumepeer-net"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
lumepeer-core.workspace = true
iroh.workspace = true
# The QUIC engine iroh is built on. Already in the dependency tree
# transitively via `iroh`; pinned here to the exact version it resolves to
# (task 17 increment 1, ADR 0052) so the two never diverge — `noq`'s own
# `AsyncUdpSocket` is the embedding point `obfuscate.rs` implements, since
# iroh 1.0.2 exposes no hook to wrap its own socket (Fase 0).
noq = "=1.2.0"
tokio.workspace = true
serde.workspace = true
serde-big-array.workspace = true
postcard.workspace = true
ed25519-dalek.workspace = true
blake3.workspace = true
rand.workspace = true
data-encoding.workspace = true
chacha20poly1305.workspace = true
thiserror.workspace = true
tracing.workspace = true
# Self-signed cert generation for the obfuscated transport's host endpoint
# (task 17 increment 2, ADR 0053) — promoted from dev-only (where increment 1
# used it only inside its own test) since `obfuscated_endpoint::bind_host` now
# generates one for real. Same version noq's own tests pin, so the
# `rustls-pki-types` types each side produces resolve to one crate.
rcgen = "0.14"
# Audio stream payload types (§11). The net crate never links a codec: this is
# the plain `AudioChunk` struct and the constants, which build without any
# feature.
lumepeer-media.workspace = true

[dev-dependencies]
proptest.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
# Only for the `wan_probe`/`obfuscated_wan_probe` examples, which need iroh's
# own logs (and, for the latter, this crate's own tracing) to explain a
# failed connection.
tracing-subscriber.workspace = true

[target.'cfg(all(target_os = "linux", not(target_os = "android")))'.dependencies]
secret-service = { version = "5.1.0", features = ["rt-tokio-crypto-rust"], optional = true }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
security-framework = "3"
security-framework-sys = "2"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"], optional = true }

[features]
secret-service = ["dep:secret-service"]
keyring = ["dep:keyring"]
