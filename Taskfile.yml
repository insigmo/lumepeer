version: "3"

vars:
  DESKTOP_DIR: apps/desktop
  # Media backends each client links in. Kept here rather than as defaults in
  # apps/desktop/src-tauri/Cargo.toml so `cargo build --workspace` still
  # needs no platform SDK (X11 headers, DXGI/D3D11 bindings, openh264); a
  # client built without them starts, pairs and consents normally and
  # reports "no capture backend" instead of showing a picture (§18).
  LINUX_MEDIA_FEATURES: capture-x11,encode-openh264
  WINDOWS_MEDIA_FEATURES: capture-windows,encode-mf
  # Build VMs reachable over passwordless SSH. Both are DHCP leases, so if a
  # VM's IP changes after a reboot, update it here — nothing else reads it.
  LINUX_HOST: beta@192.168.40.128
  MACOS_HOST: beta@192.168.1.38
  REMOTE_DIR: lumepeer

tasks:
  build:workspace:
    desc: Build all workspace crates
    cmds:
      - cargo build --workspace

  # ---------------------------------------------------------------------
  # Desktop client builds, mirroring the 6-target matrix in
  # .github/workflows/release.yml. The frontend bundle and the shared
  # workspace crates are built once and reused by every client target that
  # runs afterwards in the same `task` invocation (see build:frontend and
  # build:base below for how each is kept to a single run).
  #
  # Cross-OS bundling is not possible from a single machine: Tauri links
  # platform system libraries (webkit2gtk, Cocoa, MSVC) at build time, the
  # same reason release.yml runs each OS on its own runner. `task
  # build:clients` therefore only builds the targets valid for the host
  # it's run on (via `platforms:`) — run it on each OS to cover the full
  # matrix, same as CI does. Cross-arch targets (e.g. windows-arm64 from an
  # amd64 host, linux-arm64 without `cross`/Docker) additionally need their
  # own linker/SDK installed; `rustup target add` alone does not provide
  # that.
  # ---------------------------------------------------------------------

  build:frontend:
    desc: >-
      Build the Tauri webview bundle once. tauri-build reads frontendDist at
      compile time, and the bundle itself is platform-independent, so every
      client target reuses this same apps/desktop/dist instead of rebuilding
      it. Skipped entirely (via checksum) when sources haven't changed since
      the last run, including across separate `task` invocations.
    run: once
    dir: "{{.DESKTOP_DIR}}"
    sources:
      - src/**/*
      - index.html
      - view.html
      - package.json
      - package-lock.json
      - vite.config.ts
      - tsconfig.json
    generates:
      - dist/**/*
    cmds:
      - npm install
      - npm run build

  build:base:
    desc: >-
      Compile the shared Rust workspace crates for the host once. This warms
      the crate/build-script cache in the shared target/ directory that
      every cross-target client build below reuses for its host-context
      compilation (proc macros, build scripts), and fails fast on a plain
      workspace error before any slower per-target Tauri bundling runs.
    run: once
    deps: [build:frontend]
    cmds:
      - cargo build --workspace --exclude lumepeer-desktop

  build:client:linux-amd64:
    desc: Build the Linux amd64 client (.deb/.rpm)
    platforms: [linux/amd64]
    deps: [build:base]
    dir: "{{.DESKTOP_DIR}}"
    cmds:
      - rustup target add x86_64-unknown-linux-gnu
      - npx tauri build --target x86_64-unknown-linux-gnu --features {{.LINUX_MEDIA_FEATURES}}

  build:client:linux-arm64:
    desc: >-
      Build the Linux arm64 client (.deb/.rpm). Needs an arm64 cross
      toolchain/linker (e.g. via `cross`/Docker) unless run on an arm64
      Linux host directly.
    platforms: [linux/arm64]
    deps: [build:base]
    dir: "{{.DESKTOP_DIR}}"
    cmds:
      - rustup target add aarch64-unknown-linux-gnu
      - npx tauri build --target aarch64-unknown-linux-gnu --features {{.LINUX_MEDIA_FEATURES}}

  build:client:windows-amd64:
    desc: Build the Windows amd64 client
    platforms: [windows]
    deps: [build:base]
    dir: "{{.DESKTOP_DIR}}"
    cmds:
      - rustup target add x86_64-pc-windows-msvc
      - npx tauri build --target x86_64-pc-windows-msvc --features {{.WINDOWS_MEDIA_FEATURES}}

  build:client:windows-arm64:
    desc: >-
      Build the Windows arm64 client. Needs the "MSVC ARM64 build tools"
      component of Visual Studio installed in addition to the rustup target.
    platforms: [windows]
    deps: [build:base]
    dir: "{{.DESKTOP_DIR}}"
    cmds:
      - rustup target add aarch64-pc-windows-msvc
      - npx tauri build --target aarch64-pc-windows-msvc

  build:client:macos-arm64:
    desc: Build the macOS arm64 client
    platforms: [darwin]
    deps: [build:base]
    dir: "{{.DESKTOP_DIR}}"
    cmds:
      - rustup target add aarch64-apple-darwin
      - npx tauri build --target aarch64-apple-darwin

  build:client:macos-amd64:
    desc: >-
      Build the macOS amd64 client. App-bundle only (--bundles app), no
      .dmg: Tauri's own dmg bundling shells out to create-dmg, which drives
      Finder via AppleScript to lay out icons — that AppleEvent has no
      GUI/Aqua session to talk to over SSH and hangs until it times out
      (`AppleEvent timed out. (-1712)`), a known limitation of running
      non-interactively over SSH rather than a real login session.
      package:dmg:macos-amd64 packages this same .app into a .dmg
      afterwards without going through Tauri's bundler or Finder at all.
      release.yml's hosted macOS runners, which do have a working GUI
      session, still build the real release .dmg the ordinary way.
    platforms: [darwin]
    deps: [build:base]
    dir: "{{.DESKTOP_DIR}}"
    cmds:
      - rustup target add x86_64-apple-darwin
      - npx tauri build --target x86_64-apple-darwin --bundles app

  package:dmg:macos-amd64:
    desc: >-
      Package the macOS amd64 .app already built by build:client:macos-amd64
      into a plain .dmg. Not Tauri's own dmg bundler (which shells out to
      create-dmg, which drives Finder over AppleScript to lay out icons — see
      the comment on build:client:macos-amd64 for why that hangs over SSH).
      Plain `hdiutil create` needs no Finder/Aqua session at all, so it works
      the same way non-interactively as it does at a real console; the
      tradeoff is no icon layout, which install:macos-amd64 doesn't need
      anyway since it mounts and copies the .app straight back out.
    platforms: [darwin]
    deps: [build:client:macos-amd64]
    dir: "{{.DESKTOP_DIR}}"
    vars:
      APP_DIR: target/x86_64-apple-darwin/release/bundle/macos
      DMG_DIR: target/x86_64-apple-darwin/release/bundle/dmg
    cmds:
      - mkdir -p {{.DMG_DIR}}
      - rm -f {{.DMG_DIR}}/Lumepeer_x64.dmg
      - hdiutil create -volname Lumepeer -srcfolder {{.APP_DIR}} -ov -format UDZO {{.DMG_DIR}}/Lumepeer_x64.dmg

  build:clients:
    desc: >-
      Build every desktop client target valid for this host OS, compiling
      the frontend bundle and shared workspace crates once and reusing them
      across all of them.
    cmds:
      - task: build:client:linux-amd64
      - task: build:client:linux-arm64
      - task: build:client:windows-amd64
      - task: build:client:windows-arm64
      - task: build:client:macos-arm64
      - task: build:client:macos-amd64

  # ---------------------------------------------------------------------
  # Remote build VMs. `task release:all` is the one command that covers all
  # three OSes from this Windows machine: it builds the Windows targets
  # right here, and drives the Linux/macOS VMs over SSH, each syncing this
  # working tree — including uncommitted changes, via `git ls-files` piped
  # into `tar` rather than `git archive HEAD`, which would silently skip
  # anything not yet committed (no git needed on the remote — plain tar
  # extracts it) — and then running the same `task build:clients` there, so
  # those hosts get the identical once-per-host base/frontend caching.
  # Bootstrap requirements per VM: passwordless SSH (done), rustup/cargo
  # (done), and on the Linux VM specifically, apt packages that need a
  # one-time sudo password a non-interactive SSH session can't supply —
  # see project notes for the exact command.
  # ---------------------------------------------------------------------

  sync:linux:
    desc: >-
      Sync this working tree (including uncommitted changes) to the Linux
      build VM over SSH.
    cmds:
      # A plain `git archive HEAD` would only ever see committed content.
      # Building a tree from a throwaway index (not the real staging area,
      # and not a mktemp path — Task's cross-platform `mktemp`/`tar`
      # builtins for Windows hosts with no real coreutils don't behave like
      # the real thing, `-u` and `-T`/`--null` both broke under them)
      # captures uncommitted and untracked-but-not-ignored files too.
      # `git archive` on the resulting tree avoids depending on the local
      # `tar` binary at all. The index file name is unique to this task
      # (not shared with sync:macos) because `task build`/`release:all` run
      # both syncs concurrently — a shared name let them race on the same
      # file and corrupt each other's index.
      - |
        rm -f .git/lumepeer-sync-index-linux
        GIT_INDEX_FILE=.git/lumepeer-sync-index-linux git add -A
        TREE=$(GIT_INDEX_FILE=.git/lumepeer-sync-index-linux git write-tree)
        rm -f .git/lumepeer-sync-index-linux
        git archive --format=tar "$TREE" | ssh {{.LINUX_HOST}} "mkdir -p ~/{{.REMOTE_DIR}} && tar -xf - -C ~/{{.REMOTE_DIR}}"

  sync:macos:
    desc: >-
      Sync this working tree (including uncommitted changes) to the macOS
      build VM over SSH.
    cmds:
      - |
        rm -f .git/lumepeer-sync-index-macos
        GIT_INDEX_FILE=.git/lumepeer-sync-index-macos git add -A
        TREE=$(GIT_INDEX_FILE=.git/lumepeer-sync-index-macos git write-tree)
        rm -f .git/lumepeer-sync-index-macos
        git archive --format=tar "$TREE" | ssh {{.MACOS_HOST}} "mkdir -p ~/{{.REMOTE_DIR}} && tar -xf - -C ~/{{.REMOTE_DIR}}"

  remote:build:linux:
    desc: Sync and build every Linux client target on the remote Linux VM.
    cmds:
      - task: sync:linux
      - ssh {{.LINUX_HOST}} ". ~/lumepeer-env.sh && cd ~/{{.REMOTE_DIR}} && task build:clients"

  remote:build:macos:
    desc: Sync and build every macOS client target on the remote macOS VM.
    cmds:
      - task: sync:macos
      - ssh {{.MACOS_HOST}} ". ~/lumepeer-env.sh && cd ~/{{.REMOTE_DIR}} && task build:clients"

  release:all:
    desc: >-
      Build every desktop client for Windows, Linux and macOS with one
      command: Windows builds locally, Linux and macOS build over SSH on
      their VMs, all three running concurrently since they share nothing.
    deps:
      - build:clients
      - remote:build:linux
      - remote:build:macos

  # ---------------------------------------------------------------------
  # build: build the amd64 client for Windows, Linux and macOS — Windows
  # locally, Linux and macOS over SSH on their VMs, each build landing in
  # that machine's own target/ bundle dir — then actually install what was
  # just built on each of those same machines (this one, and both VMs),
  # echoing the exact command run for each so a manual re-run needs no
  # lookup. This used to only print the install commands, on the theory that
  # an unattended `task` run installing something elevated shouldn't happen
  # silently; in practice that meant the running app never got replaced, so
  # "just built it" and "actually running the new build" quietly drifted
  # apart (Windows NSIS/MSI can't even overwrite the old .exe while it's
  # running - a locked-file failure the printed command never surfaced back
  # here). install:windows-amd64 kills the running process first for exactly
  # that reason. Distinct from install.sh/install.ps1 at the repo root, which
  # install a *published* GitHub Release rather than this working tree's own
  # build.
  # ---------------------------------------------------------------------

  remote:build:linux-amd64:
    desc: Sync and build only the Linux amd64 client on the Linux VM over SSH.
    cmds:
      - task: sync:linux
      - ssh {{.LINUX_HOST}} ". ~/lumepeer-env.sh && cd ~/{{.REMOTE_DIR}} && task build:client:linux-amd64"

  remote:package:dmg:macos-amd64:
    desc: >-
      Sync, build and package the macOS amd64 client into a .dmg on
      {{.MACOS_HOST}} over SSH (see package:dmg:macos-amd64 for why a .dmg
      rather than a bare .app copy).
    cmds:
      - task: sync:macos
      - ssh {{.MACOS_HOST}} ". ~/lumepeer-env.sh && cd ~/{{.REMOTE_DIR}} && task package:dmg:macos-amd64"

  install:windows-amd64:
    desc: >-
      Install the Windows amd64 client build:client:windows-amd64 just
      produced (prefers the silent NSIS installer, falls back to the msi).
      Kills any running lumepeer-desktop.exe first: an installer can't
      replace a locked exe, and that lock is the usual reason a build
      "didn't take" - the old process just kept running the old file.
    platforms: [windows]
    cmds:
      - |
        set -e
        taskkill /IM lumepeer-desktop.exe /F >/dev/null 2>&1 || true
        nsis=$(ls target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe 2>/dev/null | head -1)
        if [ -n "$nsis" ]; then
          echo "$nsis /S"
          "$nsis" /S
        else
          msi=$(ls target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi 2>/dev/null | head -1)
          if [ -z "$msi" ]; then
            echo "no installer under target/x86_64-pc-windows-msvc/release/bundle/{nsis,msi} - run 'task build:client:windows-amd64' first" >&2
            exit 1
          fi
          echo "msiexec /i \"$msi\" /quiet /norestart"
          msiexec /i "$msi" /quiet /norestart
        fi

  install:linux-amd64:
    desc: >-
      Install the Linux amd64 client build:client:linux-amd64 just produced,
      on {{.LINUX_HOST}} over SSH (needs the VM's one-time passwordless-sudo
      setup from the project notes).
    cmds:
      - |
        cmd='cd ~/{{.REMOTE_DIR}} && test -d target/x86_64-unknown-linux-gnu/release/bundle/deb || { echo "no Linux build on {{.LINUX_HOST}} yet - run task remote:build:linux-amd64 first" >&2; exit 1; }; sudo dpkg -i target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb || sudo apt-get install -f -y'
        echo "ssh {{.LINUX_HOST}} \"$cmd\""
        ssh {{.LINUX_HOST}} "$cmd"

  install:macos-amd64:
    desc: >-
      Mount the .dmg package:dmg:macos-amd64 just built on {{.MACOS_HOST}}
      and install it to /Applications there - the same mount/copy/detach
      install.sh's install_macos does for a published release, just against
      this working tree's own build instead.
    cmds:
      - |
        cmd='cd ~/{{.REMOTE_DIR}} && dmg=$(ls target/x86_64-apple-darwin/release/bundle/dmg/*.dmg 2>/dev/null | head -1); test -n "$dmg" || { echo "no macOS dmg on {{.MACOS_HOST}} yet - run task remote:package:dmg:macos-amd64 first" >&2; exit 1; }; killall Lumepeer >/dev/null 2>&1; mnt=$(mktemp -d) && hdiutil attach "$dmg" -nobrowse -quiet -mountpoint "$mnt" && rm -rf /Applications/Lumepeer.app && cp -R "$mnt"/*.app /Applications/ && hdiutil detach "$mnt" -quiet'
        echo "ssh {{.MACOS_HOST}} \"$cmd\""
        ssh {{.MACOS_HOST}} "$cmd"

  build:
    desc: >-
      Build the amd64 client for Windows, Linux and macOS — Windows
      locally, Linux and macOS over SSH on their VMs, all three running
      concurrently since they share nothing — then install what was just
      built on each of those same machines, echoing the exact command run
      for each. See the comment above this section for why installing is
      no longer left as a printed suggestion.
    deps:
      - build:client:windows-amd64
      - remote:build:linux-amd64
      - remote:package:dmg:macos-amd64
    cmds:
      - task: install:windows-amd64
      - task: install:linux-amd64
      - task: install:macos-amd64
