[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/net",
    "crates/media",
    "crates/decoder-worker",
    "crates/service",
    "apps/desktop/src-tauri",
    "services/broker",
    "tests/integration",
]

[workspace.package]
version = "0.0.34"
edition = "2024"
rust-version = "1.97"
publish = false
repository = "https://github.com/insigmo/lumepeer"

[workspace.dependencies]
# Local crates. Directory layout follows design doc §6; package names are
# prefixed to avoid collisions with `core`/`net`/`media` in the Rust namespace.
lumepeer-core = { path = "crates/core" }
lumepeer-net = { path = "crates/net" }
lumepeer-media = { path = "crates/media" }
lumepeer-service = { path = "crates/service" }
lumepeer-decoder-worker = { path = "crates/decoder-worker" }

# Design doc §5 — exact pins, updates go through a dedicated compatibility PR.
iroh = "=1.0.2"
# `key` is not a default feature; `NodeId` is `iroh_base::PublicKey` (§7).
iroh-base = { version = "=1.0.2", features = ["key"] }
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "io-util",
    # File-transfer staging (§9.2, ADR 0032): a 500 MiB transfer must not be
    # written with blocking `std::fs` calls from inside an async task.
    "fs",
] }
postcard = { version = "1", features = ["use-std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-big-array = "0.5"
ed25519-dalek = "2.0.0"
blake3 = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
axum = "0.8"
sqlx = { version = "0.8", default-features = false, features = [
    "sqlite",
    "runtime-tokio-rustls",
    "macros",
    "migrate",
] }
toml = "0.8"
# Per-user autostart on Windows: the HKCU Run key (ADR 0042). Not named in
# §5; already in the tree as a transitive build dependency of tauri-winres.
winreg = "0.56.0"
config = "0.15.25"
# Deviations from §5 are recorded in docs/adr/0002-dependency-version-deviations.md
scap = "=0.1.0-beta.1" # `scap = "0.1"` in §5 does not resolve: only pre-releases exist
openh264 = "0.9"       # §5 says 0.6; 0.6 is long unmaintained
# Not named in §5; see docs/adr/0004-phase-1-transport-dependencies.md.
rand = "0.10"           # CSPRNG for session ids and invite ids (§7, §9.1)
data-encoding = "2"     # base32 for the QR ticket encoding (§7)
chacha20poly1305 = "0.11.0" # encrypted-file keystore fallback (§11.2)
opus = "0.4.0"             # Opus audio codec bindings over vendored libopus (§5.1, ADR 0023)
# Unattended-access password hashing (phase 7 catch-up; ADR 0021). Not named
# in §5; the spec predates the unattended feature.
argon2 = "0.6.0"
# HMAC-SHA1 for RFC 6238 TOTP only (ADR 0021): SHA1 stays confined to the
# compatibility requirement towards authenticator apps; nothing else uses it.
hmac = "0.13.0"
sha1 = "0.11.0"
# Host clipboard access for §9.2. Deliberately on the Rust side and not a
# webview plugin: the webview is an untrusted presentation layer (§2.3), so
# it never gets a handle on the host's clipboard. `image-data` is off — §9.2
# is text-only for v1, and the feature pulls in the whole `image` stack.
arboard = { version = "3", default-features = false }
x11rb = "0.14.0"          # safe X11 client for the lower-trust Linux capture (§11)
memmap2 = "0.9"         # shared memory ring buffer for decoder IPC (§11.3)
seccompiler = "0.5"     # seccomp-BPF filter for the decoder worker (§11.3)
libc = "0.2"            # syscall numbers for that filter

tauri = { version = "2", features = ["tray-icon"] }
tauri-build = { version = "2", features = [] }
tauri-plugin-updater = "2"
# Native file/directory pickers for §9.2, used **only** from Rust. The
# webview never gets `dialog:` or `fs:` permissions: `capabilities/view.json`
# says the view window has no filesystem rights, and a picker that ran in the
# webview would be exactly that right under another name (ADR 0032).
tauri-plugin-dialog = "2"
# One process per machine (docs/bugs/01). A second launch must hand the first
# one's window back to the user rather than binding a second iroh endpoint:
# the invite code already handed out points at the first process's NodeId, so
# two live endpoints mean the UI the user is looking at is not the one the
# guest is dialing.
tauri-plugin-single-instance = "2"

# dev-dependencies
proptest = "1"
ureq = { version = "3.4.0", features = ["json"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Design doc §21: no `unwrap`/`expect` on network, parse, keystore or permission paths.
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "debuginfo"
