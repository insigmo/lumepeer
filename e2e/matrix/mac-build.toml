# Cargo settings for the Mac e2e build (deploy.sh mac).
#
# The build stays a debug one, which tauri-pilot needs, but the Mac VM has no
# GPU and its picture path runs on the CPU: unoptimised, a frame took
# 110-170 ms to convert and encode, the speed controller then scaled the
# picture down, and `still` (3d) measured the debug build rather than the
# product (ADR 0155). Optimised here: every dependency and the two crates the
# picture goes through.
#
# Two jobs: an optimised build with four left the VM (4 vCPUs, 8 GB) unable to
# answer anything until it was reset.

[build]
jobs = 2

[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.lumepeer-media]
opt-level = 3

[profile.dev.package.lumepeer-runtime]
opt-level = 3
