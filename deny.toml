[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
ignore = [
    # Unmaintained-only advisories (no CVE, "no safe upgrade available") from
    # Tauri 2.x's Linux GTK3 windowing stack (atk/gdk/gtk/... via
    # muda/tao/webkit2gtk/wry) and a few of its transitive deps. These track
    # Tauri's own migration to gtk4-rs; nothing to act on from this repo.
    "RUSTSEC-2024-0411", # atk
    "RUSTSEC-2024-0412", # atk-sys
    "RUSTSEC-2024-0413", # gdk
    "RUSTSEC-2024-0414", # gdk-sys
    "RUSTSEC-2024-0415", # gdk-pixbuf
    "RUSTSEC-2024-0416", # gdk-pixbuf-sys
    "RUSTSEC-2024-0417", # gio
    "RUSTSEC-2024-0418", # gio-sys
    "RUSTSEC-2024-0419", # glib
    "RUSTSEC-2024-0420", # glib-sys
    "RUSTSEC-2024-0436", # paste, unmaintained
    "RUSTSEC-2023-0089", # atomic-polyfill, unmaintained
    "RUSTSEC-2024-0370", # proc-macro-error, unmaintained
    "RUSTSEC-2025-0075", # unic-char-property, unmaintained
    "RUSTSEC-2025-0080", # unic-common, unmaintained
    "RUSTSEC-2025-0081", # unic-char-range, unmaintained
    "RUSTSEC-2025-0098", # unic-ucd-version, unmaintained
    "RUSTSEC-2025-0100", # unic-ucd-ident, unmaintained
]

[licenses]
unused-allowed-license = "allow"
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
    "Unlicense",
    "CC0-1.0",
    # Boost Software License 1.0: OSI-approved and permissive, with no notice
    # requirement for binary distribution at all — strictly less demanding
    # than MIT, which is already on this list. Reaches the tree through
    # `arboard`'s Windows clipboard backend (`clipboard-win`, `error-code`),
    # and `apps/desktop/src-tauri` now also depends on `clipboard-win`
    # directly, at the same version, for clipboard file lists (docs/bugs/
    # 14-clipboard-files.md; ADR 0047).
    "BSL-1.0",
]
confidence-threshold = 0.9

[licenses.private]
# All workspace crates are `publish = false` (§workspace.package): there is no
# license to check for something that is never published.
ignore = true

[bans]
multiple-versions = "warn"
# Every crate this flags is an intra-workspace `path` dependency
# (`lumepeer-*.workspace = true`): those have no ambiguous registry version to
# pin, so the wildcard check has nothing to protect against here.
wildcards = "allow"
# `quinn` is an internal choice of iroh (design doc §5, §20): pinning it by hand
# may break iroh compatibility, so it must not become a direct dependency.
deny = [{ crate = "quinn" }]

# The following are transitive duplicate versions confirmed by `cargo deny
# check` against the current Cargo.lock (2026-08-29). None of these are our
# own direct workspace dependencies (see Cargo.toml) — they come in through
# independent upstream crates (tauri/tao/wry, iroh, sqlx, arboard, etc.) that
# have not yet converged on the same major version of these transitive
# crates. Re-run `cargo tree --workspace --duplicates` after any
# `cargo update` and prune entries that no longer appear, otherwise
# cargo-deny will start warning about unused `skip` entries instead.
skip = [
    { crate = "aead:0.5.2" },
    { crate = "base64:0.21.7" },
    { crate = "bitflags:1.3.2" },
