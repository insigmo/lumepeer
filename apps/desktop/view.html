<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lumepeer — remote screen</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #101014;
        color: #f2f2f5;
        font-family: system-ui, sans-serif;
      }
      #view {
        position: relative;
        height: 100%;
        display: grid;
        place-items: center;
      }
      #screen {
        max-width: 100%;
        max-height: 100%;
        /* The remote screen is already the picture; smoothing a 1:1 blit only
           costs time. */
        image-rendering: pixelated;
      }
      .view-banner {
        position: absolute;
        inset-inline: 0;
        inset-block-start: 0;
        margin: 0;
        padding: 0.5rem 1rem;
        background: rgb(0 0 0 / 70%);
        text-align: center;
      }
      .view-modal {
        position: absolute;
        inset: 0;
        margin: auto;
        width: min(28rem, 90%);
        height: fit-content;
        padding: 1.5rem;
        border-radius: 0.5rem;
        background: #1c1c22;
        box-shadow: 0 0 0 100vmax rgb(0 0 0 / 60%);
      }
    </style>
  </head>
  <body>
    <main id="view">
      <canvas id="screen" width="1" height="1"></canvas>
      <div id="overlay"></div>
    </main>
    <script type="module" src="/src/view.ts"></script>
  </body>
</html>
