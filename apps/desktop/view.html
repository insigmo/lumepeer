<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lumepeer — remote screen</title>
    <link rel="stylesheet" href="/src/tokens.css" />
    <link rel="stylesheet" href="/src/terminal-chrome.css" />
    <style>
      /* The chrome around somebody else's screen follows the app's light or
         dark like every other window (ADR 0168); the picture itself is never
         recoloured. */
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: var(--font-ui);
        -webkit-font-smoothing: antialiased;
      }
      ::selection {
        background: var(--selection);
      }
      #view {
        position: relative;
        height: 100%;
        display: grid;
        place-items: center;
        /* A picture at 1:1 or zoomed in is wider than the window on purpose;
           panning is how it is reached (§11), so the overflow is clipped
           rather than turned into scrollbars over the remote screen. */
        overflow: hidden;
        /* Middle-button drag pans. Without this the browser's own autoscroll
           takes the gesture first and the pan never happens. */
        overscroll-behavior: contain;
      }
      #screen {
        /* Placed by `applyLayout` from the window's corner (a translate), not
           centred by the grid: the grid centres only a picture that fits, and
           one larger than the window (1:1, zoomed in) went to the corner
           while the pointer was mapped as if it were centred (ADR 0154).
           Physical `left`/`top`, because pointer positions are physical: in a
           right-to-left window `inset-inline-start` would be the right edge. */
        position: absolute;
        left: 0;
        top: 0;
        /* Sized in CSS pixels by `applyLayout`, which is also why these two
           are only a starting point: the canvas *buffer* stays at the frame's
           own resolution so `putImageData` never has to scale (§11). */
        max-width: 100%;
        max-height: 100%;
        /* Only the starting value, for the moment before the first frame:
           `applyLayout` overrides it on every layout because the right answer
           depends on the scale, which CSS cannot see. Smoothing a 1:1 blit
           only costs time, and magnifying wants nearest neighbour — but the
           default `fit` mode shrinks a 1080p host into the window, and
           shrinking with nearest neighbour drops the thin strokes of a glyph
           whole. See `PIXELATED_MIN_SCALE` in `view-window.ts`. */
        image-rendering: pixelated;
        /* The ordinary arrow. Pointer motion is sent as an absolute position
           normalized to this canvas, so the local pointer sits exactly where
           the click will land on the host and hiding it outright would leave
           the operator aiming blind. `view.ts` overrides this with `none` for
           the one state that has its own pointer to show — the host's shape
           drawn on the `#cursor` layer (ADR 0038) — and puts it back the
           moment that stops being true. It used to be a crosshair, from before
           that layer existed and the host's cursor was only ever composited
           into the picture; with the layer, a crosshair is the second cursor
           on screen. */
        cursor: default;
      }
      /* A status line ("waiting", "reconnecting") as a plate in the middle
         of the window rather than a strip along the top: the toolbar starts
         at the top edge, and a strip there ran its words beneath the
         buttons. */
      .view-banner {
        position: absolute;
        inset-block-start: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        box-sizing: border-box;
        max-width: calc(100% - 2rem);
        margin: 0;
        padding: 0.45rem 1rem;
        background: var(--raised);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: var(--radius-key);
        box-shadow: var(--shadow-md);
        font-size: 13px;
        text-align: center;
      }
      /* Recording indicator (§17). Top-centre, above everything, and with no
         way to dismiss it: an indicator someone can put away is not one. */
      .view-recording {
        position: absolute;
        inset-inline: 0;
        inset-block-start: 0;
        z-index: 40;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.4rem;
        margin: 0;
        padding: 0.35rem 1rem;
        background: var(--danger-solid);
        color: var(--on-danger);
        font-size: 0.85rem;
        font-weight: 600;
        pointer-events: none;
      }
      /* Video statistics (Ctrl+Alt+Shift+S). Bottom corner, clear of the
         toolbar at the top, and transparent to the pointer: it sits over the
         remote screen, and a click on it belongs to the host. */
      /* A readout window, dark in both themes like every live value. */
      .view-stats {
        position: absolute;
        inset-inline-start: 0.75rem;
        inset-block-end: 0.75rem;
        z-index: 30;
        margin: 0;
        padding: 0.6rem 0.8rem;
        border-radius: var(--radius);
        background: var(--readout-bg);
        color: var(--readout-text);
        box-shadow: var(--shadow-md);
        font-size: 0.75rem;
        line-height: 1.35;
        font-variant-numeric: tabular-nums;
        pointer-events: none;
      }
      .view-stats-title {
        margin: 0 0 0.25rem;
        font-size: 0.8rem;
        font-weight: 600;
      }
      .view-stats-rows {
        display: grid;
        grid-template-columns: auto auto;
        column-gap: 1rem;
        margin: 0;
      }
      .view-stats-rows dt {
        color: var(--readout-dim);
      }
      .view-stats-rows dd {
        margin: 0;
        text-align: end;
      }
      .view-recording-dot {
        width: 0.6rem;
        height: 0.6rem;
        border-radius: 50%;
        background: var(--on-danger);
        box-shadow: 0 0 0 3px rgb(255 255 255 / 30%);
      }
      #chat-panel {
        position: absolute;
        inset-block-end: 0;
        inset-inline-end: 0;
        width: min(20rem, 40vw);
        max-height: 45%;
        display: flex;
        flex-direction: column;
        background: var(--raised);
        border: 1px solid var(--border);
        border-inline-end: 0;
        border-block-end: 0;
        border-start-start-radius: var(--radius-lg);
        box-shadow: var(--shadow-lg);
        font-size: 0.85rem;
      }
      /* Without this the panel cannot be hidden at all: the browser's own
         `[hidden] { display: none }` is specificity (0,1,0) and loses to the
         `#chat-panel` rule above, so `hidden = true` would leave it laid out
         and on screen. Same reason `#cursor[hidden]` below exists. */
      #chat-panel[hidden] {
        display: none;
      }
      /* The terminal takes the bottom of the picture across its whole width:
         a shell wrapped into a narrow column is a shell whose output is wrong
         (ADR 0079). */
      #terminal-panel {
        position: absolute;
        inset-block-end: 0;
        inset-inline: 0;
        height: min(22rem, 50%);
        display: flex;
        flex-direction: column;
        /* The emulator's own background (`terminalTheme`, ADR 0132), so the
           chrome and the shell read as one surface. */
        background: var(--term-bg);
        border-block-start: 1px solid var(--border);
        font-size: 0.85rem;
      }
      /* Same specificity problem `#chat-panel[hidden]` has, same answer. */
      #terminal-panel[hidden] {
        display: none;
      }
      /* A window with no picture in it: the shell is the window (ADR 0101).
         Set on `#view` by `view.ts` when the actor opened this window for a
         terminal, so the panel is not a strip along the bottom of a black
         rectangle nobody is drawing into. */
      #view.is-terminal-only #terminal-panel {
        inset: 0;
        height: auto;
        border: 0;
        background: var(--term-bg);
      }
      /* The "reconnecting" banner of a terminal window. The panel fills the
         window and comes later in the document, so without this it would
         cover the banner; and at the bottom rather than the top, where it
         would cover the panel's own Close button. */
      #view.is-terminal-only .view-banner {
        z-index: 1;
        inset-block-start: auto;
        inset-block-end: 0.75rem;
        transform: translateX(-50%);
      }
      #terminal-screen {
        flex: 1;
        min-height: 0;
        padding: 0.25rem 0.5rem;
      }
      .chat-log {
        flex: 1;
        overflow-y: auto;
        margin: 0;
        padding: 0.5rem;
        list-style: none;
      }
      .chat-row {
        margin-block: 0.15rem;
        overflow-wrap: anywhere;
      }
      .chat-out {
        text-align: end;
        color: var(--accent-text);
      }
      .chat-in {
        text-align: start;
        color: var(--text);
      }
      .chat-compose {
        display: flex;
        gap: 0.35rem;
        padding: 0.5rem;
        border-block-start: 1px solid var(--border);
      }
      .chat-input {
        flex: 1;
        min-width: 0;
        background: var(--control-bg);
        color: inherit;
        caret-color: var(--accent-text);
        border: 1px solid var(--border-strong);
        border-radius: var(--radius-key);
        padding: 0.35rem 0.75rem;
        font: inherit;
      }
      .chat-input:focus-visible {
        outline: none;
        border-color: var(--focus);
        box-shadow: 0 0 0 3px var(--accent-ring);
      }
      .chat-send {
        background: var(--accent);
        color: var(--on-accent);
        border: 0;
        border-radius: var(--radius-key);
        padding: 0.35rem 0.85rem;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      .chat-send:hover {
        background: var(--accent-hover);
      }
      .view-modal {
        position: absolute;
        inset: 0;
        margin: auto;
        width: min(28rem, 90%);
        height: fit-content;
        padding: 1.5rem;
        border-radius: var(--radius-xl);
        background: var(--raised);
        color: var(--text);
        box-shadow:
          0 0 0 100vmax var(--scrim),
          var(--shadow-lg);
      }
      #cursor {
        position: absolute;
        /* Physical, like `#screen`: `view.ts` sets `left` from the pointer's
           client position, and with `inset-inline-start` a right-to-left
           window (Arabic) had `right: 0` as well, which wins there — the
           host's cursor sat at the right edge whatever the pointer did. */
        top: 0;
        left: 0;
        z-index: 20;
        /* Purely decorative: every event under it belongs to the picture. */
        pointer-events: none;
        image-rendering: pixelated;
      }
      #cursor[hidden] {
        display: none;
      }
      /* Floating session toolbar (§11). Sits on top of the picture, follows
         the drag handle, and collapses to a single pill. */
      #toolbar-root {
        position: absolute;
        z-index: 30;
      }
      /* Full screen hides the window chrome, so the toolbar is the only way
         back out with a pointer: it fades rather than disappears, and comes
         back on hover or on focus. Never `display: none` or `visibility:
         hidden` — either would take it out of hit testing and out of the tab
         order, which is exactly the trap this avoids. */
      #toolbar-root.is-autohide {
        opacity: 0.08;
        transition: opacity 0.15s ease;
      }
      #toolbar-root.is-autohide:hover,
      #toolbar-root.is-autohide:focus-within {
        opacity: 1;
      }
      @media (prefers-reduced-motion: reduce) {
        #toolbar-root.is-autohide {
          transition: none;
        }
      }
      .toolbar-pop-heading {
        margin: 0.7rem 0 0.3rem;
        color: var(--text-3);
        font-size: 12px;
        font-weight: 500;
        text-transform: lowercase;
      }
      .toolbar-hotkeys {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 0.15rem 0.6rem;
        margin: 0;
        font-size: 0.75rem;
      }
      .toolbar-hotkeys dt {
        color: var(--accent-text);
        white-space: nowrap;
        font-family: var(--font-mono);
      }
      .toolbar-hotkeys dd {
        margin: 0;
        color: var(--text-2);
      }
      .toolbar {
        display: inline-flex;
        align-items: center;
        gap: 0.15rem;
        padding: 0.25rem;
        /* Glyphs on a plate, nothing else over the picture: the remote screen
           owns this window. */
        background: color-mix(in srgb, var(--raised) 94%, transparent);
        color: var(--text-2);
        border: 1px solid var(--border);
        border-radius: var(--radius-key);
        box-shadow: var(--shadow-md);
      }
      .toolbar-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 2rem;
        height: 2rem;
        padding: 0;
        background: transparent;
        color: var(--text-2);
        border: none;
        border-radius: var(--radius-key);
        cursor: pointer;
      }
      .toolbar-btn:hover:not(.is-disabled) {
        background: var(--hover-strong);
        color: var(--text);
      }
      .toolbar-btn:focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 1px;
      }
      .toolbar-btn.is-active {
        background: var(--accent-soft-strong);
        color: var(--text);
      }
      .toolbar-btn.is-disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      /* The transient "a clipboard just synced" note, next to the toolbar
         (§15: the fact only, never the content). */
      .toolbar-clipboard-note {
        display: inline-flex;
        align-items: center;
        margin-inline-start: 0.2rem;
        padding: 2px 10px;
        border: 1px solid var(--border);
        border-radius: var(--radius-key);
        background: var(--raised);
        color: var(--green-text);
        box-shadow: var(--shadow-sm);
        font-size: 12px;
        white-space: nowrap;
      }
      .toolbar-handle {
        cursor: grab;
      }
      .toolbar-handle:active {
        cursor: grabbing;
      }
      .toolbar svg {
        width: 1.1rem;
        height: 1.1rem;
        pointer-events: none;
      }
      .toolbar-pop {
        position: absolute;
        inset-block-start: calc(100% + 0.4rem);
        inset-inline-start: 0;
        min-width: 12rem;
        padding: 0.75rem;
        background: var(--raised);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-lg);
        font-size: 0.85rem;
      }
      .toolbar-pop-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.5rem;
      }
      /* Asking the host to go down (ADR 0084). Side by side and equally
         weighted: a restart and a shutdown are different decisions, and
         making one of them the quiet secondary would be this side deciding
         which the person meant. Red, because both end the session. */
      .toolbar-power {
        gap: 0.4rem;
      }
      .toolbar-power button {
        flex: 1;
        padding: 0.4rem 0.6rem;
        background: var(--red-soft);
        color: var(--red);
        border: 1px solid var(--red);
        border-radius: var(--radius-key);
        cursor: pointer;
        font: inherit;
        font-size: 12px;
        font-weight: 600;
        line-height: 1.2;
      }
      .toolbar-power button:hover {
        background: var(--danger-solid);
        color: var(--on-danger);
      }
      .toolbar-power button:focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 1px;
      }
      /* The zoom stepper, shown only while the picture size is "Zoom". */
      .toolbar-zoom {
        display: inline-flex;
        align-items: center;
        gap: 0.3rem;
      }
      .toolbar-zoom button {
        width: 1.4rem;
        height: 1.4rem;
        padding: 0;
        background: var(--surface-2);
        color: inherit;
        border: none;
        border-radius: var(--radius-key);
        cursor: pointer;
        line-height: 1;
      }
      .toolbar-zoom button:hover {
        background: var(--surface-3);
      }
      .toolbar-zoom button:focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 1px;
      }
      .toolbar-zoom output {
        min-width: 3.2rem;
        text-align: center;
        font-variant-numeric: tabular-nums;
      }
      .toolbar-pop-note {
        margin: 0.5rem 0 0;
        color: var(--text-3);
        font-size: 12px;
      }
      .toolbar-monitor-list {
        margin: 0;
        padding: 0;
        list-style: none;
        display: grid;
        gap: 0.25rem;
      }
      .toolbar-monitor-size {
        color: var(--text-3);
        margin-inline-start: 0.4rem;
        font-size: 12px;
        font-variant-numeric: tabular-nums;
      }
      .toolbar-monitor-list button {
        width: 100%;
        text-align: start;
        padding: 0.35rem 0.5rem;
        background: transparent;
        color: inherit;
        border: 1px solid transparent;
        border-radius: var(--radius);
        cursor: pointer;
        font: inherit;
      }
      .toolbar-monitor-list button:hover {
        background: var(--hover-strong);
      }
      .toolbar-monitor-list button.is-active {
        border-color: var(--focus);
        background: var(--accent-soft);
      }
    </style>
  </head>
  <body>
    <main id="view">
      <canvas id="screen" width="1" height="1"></canvas>
      <!-- The host's cursor, drawn locally at the local pointer (§11). Its own
           layer rather than the video canvas: drawn into that one it would
           have to be erased by hand on every frame, and it is hidden outright
           on a host that still draws the cursor into the picture. -->
      <canvas id="cursor" width="1" height="1" aria-hidden="true" hidden></canvas>
      <div id="overlay"></div>
      <div id="recording-indicator"></div>
      <!-- Video statistics (Ctrl+Alt+Shift+S): hidden until asked for. -->
      <div id="stats-overlay" hidden></div>
      <aside id="chat-panel" class="chat-panel" hidden></aside>
      <!-- The terminal (ADR 0079). Two elements rather than one: `xterm.js`
           owns `#terminal-screen` outright and a re-render would destroy it,
           so the chrome around it is drawn into its own sibling. -->
      <aside id="terminal-panel" aria-labelledby="term-heading" hidden>
        <div id="terminal-chrome"></div>
        <div id="terminal-screen"></div>
      </aside>
      <div id="toolbar-root"></div>
    </main>
    <script type="module" src="/src/view.ts"></script>
  </body>
</html>
