<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lumepeer — remote screen</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #101014;
        color: #f2f2f5;
        font-family: system-ui, sans-serif;
      }
      #view {
        position: relative;
        height: 100%;
        display: grid;
        place-items: center;
      }
      #screen {
        max-width: 100%;
        max-height: 100%;
        /* The remote screen is already the picture; smoothing a 1:1 blit only
           costs time. */
        image-rendering: pixelated;
        /* A crosshair, not `none` and not the usual arrow. Pointer motion is
           sent as an absolute position normalized to this canvas, so the local
           pointer sits exactly where the click will land on the host and
           hiding it leaves the operator aiming blind. A crosshair rather than
           an arrow because the host's own cursor is composited into the
           picture on the platforms that can (Windows, macOS): two arrows would
           be indistinguishable, an arrow under a crosshair is not. */
        cursor: crosshair;
      }
      .view-banner {
        position: absolute;
        inset-inline: 0;
        inset-block-start: 0;
        margin: 0;
        padding: 0.5rem 1rem;
        background: rgb(0 0 0 / 70%);
        text-align: center;
      }
      #chat-panel {
        position: absolute;
        inset-block-end: 0;
        inset-inline-end: 0;
        width: min(20rem, 40vw);
        max-height: 45%;
        display: flex;
        flex-direction: column;
        background: rgb(0 0 0 / 72%);
        border-start-start-radius: 0.5rem;
        font-size: 0.85rem;
      }
      .chat-log {
        flex: 1;
        overflow-y: auto;
        margin: 0;
        padding: 0.5rem;
        list-style: none;
      }
      .chat-row {
        margin-block: 0.15rem;
        overflow-wrap: anywhere;
      }
      .chat-out {
        text-align: end;
        color: #9fd0ff;
      }
      .chat-in {
        text-align: start;
        color: #f2f2f5;
      }
      .chat-compose {
        display: flex;
        gap: 0.25rem;
        padding: 0.35rem;
        border-block-start: 1px solid rgb(255 255 255 / 18%);
      }
      .chat-input {
        flex: 1;
        min-width: 0;
        background: #1c1c22;
        color: inherit;
        border: 1px solid rgb(255 255 255 / 25%);
        border-radius: 0.25rem;
        padding: 0.25rem 0.4rem;
      }
      .chat-send {
        background: #2b2b33;
        color: inherit;
        border: 1px solid rgb(255 255 255 / 25%);
        border-radius: 0.25rem;
        padding: 0.25rem 0.6rem;
      }
      .view-modal {
        position: absolute;
        inset: 0;
        margin: auto;
        width: min(28rem, 90%);
        height: fit-content;
        padding: 1.5rem;
        border-radius: 0.5rem;
        background: #1c1c22;
        box-shadow: 0 0 0 100vmax rgb(0 0 0 / 60%);
      }
    </style>
  </head>
  <body>
    <main id="view">
      <canvas id="screen" width="1" height="1"></canvas>
      <div id="overlay"></div>
      <aside id="chat-panel" class="chat-panel" hidden></aside>
    </main>
    <script type="module" src="/src/view.ts"></script>
  </body>
</html>
