<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lumepeer — remote screen</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #101014;
        color: #f2f2f5;
        font-family: system-ui, sans-serif;
      }
      #view {
        position: relative;
        height: 100%;
        display: grid;
        place-items: center;
        /* A picture at 1:1 or zoomed in is wider than the window on purpose;
           panning is how it is reached (§11), so the overflow is clipped
           rather than turned into scrollbars over the remote screen. */
        overflow: hidden;
        /* Middle-button drag pans. Without this the browser's own autoscroll
           takes the gesture first and the pan never happens. */
        overscroll-behavior: contain;
      }
      #screen {
        /* Sized in CSS pixels by `applyLayout`, which is also why these two
           are only a starting point: the canvas *buffer* stays at the frame's
           own resolution so `putImageData` never has to scale (§11). */
        max-width: 100%;
        max-height: 100%;
        /* Only the starting value, for the moment before the first frame:
           `applyLayout` overrides it on every layout because the right answer
           depends on the scale, which CSS cannot see. Smoothing a 1:1 blit
           only costs time, and magnifying wants nearest neighbour — but the
           default `fit` mode shrinks a 1080p host into the window, and
           shrinking with nearest neighbour drops the thin strokes of a glyph
           whole. See `PIXELATED_MIN_SCALE` in `view-window.ts`. */
        image-rendering: pixelated;
        /* The ordinary arrow. Pointer motion is sent as an absolute position
           normalized to this canvas, so the local pointer sits exactly where
           the click will land on the host and hiding it outright would leave
           the operator aiming blind. `view.ts` overrides this with `none` for
           the one state that has its own pointer to show — the host's shape
           drawn on the `#cursor` layer (ADR 0038) — and puts it back the
           moment that stops being true. It used to be a crosshair, from before
           that layer existed and the host's cursor was only ever composited
           into the picture; with the layer, a crosshair is the second cursor
           on screen. */
        cursor: default;
      }
      .view-banner {
        position: absolute;
        inset-inline: 0;
        inset-block-start: 0;
        margin: 0;
        padding: 0.5rem 1rem;
        background: rgb(0 0 0 / 70%);
        text-align: center;
      }
      /* Recording indicator (§17). Top-centre, above everything, and with no
         way to dismiss it: an indicator someone can put away is not one. */
      .view-recording {
        position: absolute;
        inset-inline: 0;
        inset-block-start: 0;
        z-index: 40;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.4rem;
        margin: 0;
        padding: 0.35rem 1rem;
        background: rgb(150 20 30 / 88%);
        font-size: 0.85rem;
        font-weight: 600;
        pointer-events: none;
      }
      /* Video statistics (Ctrl+Alt+Shift+S). Bottom corner, clear of the
         toolbar at the top, and transparent to the pointer: it sits over the
         remote screen, and a click on it belongs to the host. */
      .view-stats {
        position: absolute;
        inset-inline-start: 0.75rem;
        inset-block-end: 0.75rem;
        z-index: 30;
        margin: 0;
        padding: 0.5rem 0.75rem;
        border-radius: 0.5rem;
        background: rgb(0 0 0 / 72%);
        font-size: 0.75rem;
        line-height: 1.35;
        font-variant-numeric: tabular-nums;
        pointer-events: none;
      }
      .view-stats-title {
        margin: 0 0 0.25rem;
        font-size: 0.8rem;
        font-weight: 600;
      }
      .view-stats-rows {
        display: grid;
        grid-template-columns: auto auto;
        column-gap: 1rem;
        margin: 0;
      }
      .view-stats-rows dt {
        opacity: 0.75;
      }
      .view-stats-rows dd {
        margin: 0;
        text-align: end;
      }
      .view-recording-dot {
        width: 0.6rem;
        height: 0.6rem;
        border-radius: 50%;
        background: #ff5a5a;
        box-shadow: 0 0 0.4rem #ff5a5a;
      }
      #chat-panel {
        position: absolute;
        inset-block-end: 0;
        inset-inline-end: 0;
        width: min(20rem, 40vw);
        max-height: 45%;
        display: flex;
        flex-direction: column;
        background: rgb(0 0 0 / 72%);
        border-start-start-radius: 0.5rem;
        font-size: 0.85rem;
      }
      /* Without this the panel cannot be hidden at all: the browser's own
         `[hidden] { display: none }` is specificity (0,1,0) and loses to the
         `#chat-panel` rule above, so `hidden = true` would leave it laid out
         and on screen. Same reason `#cursor[hidden]` below exists. */
      #chat-panel[hidden] {
        display: none;
      }
      /* The terminal takes the bottom of the picture across its whole width:
         a shell wrapped into a narrow column is a shell whose output is wrong
         (ADR 0079). */
      #terminal-panel {
        position: absolute;
        inset-block-end: 0;
        inset-inline: 0;
        height: min(22rem, 50%);
        display: flex;
        flex-direction: column;
        /* The emulator's own background (`TERMINAL_THEME`, ADR 0132), so the
           chrome and the shell read as one surface. */
        background: rgb(14 17 21 / 94%);
        font-size: 0.85rem;
      }
      /* Same specificity problem `#chat-panel[hidden]` has, same answer. */
      #terminal-panel[hidden] {
        display: none;
      }
      /* A window with no picture in it: the shell is the window (ADR 0101).
         Set on `#view` by `view.ts` when the actor opened this window for a
         terminal, so the panel is not a strip along the bottom of a black
         rectangle nobody is drawing into. */
      #view.is-terminal-only #terminal-panel {
        inset: 0;
        height: auto;
        background: rgb(14 17 21 / 100%);
      }
      /* The "reconnecting" banner of a terminal window. The panel fills the
         window and comes later in the document, so without this it would
         cover the banner; and at the bottom rather than the top, where it
         would cover the panel's own Close button. */
      #view.is-terminal-only .view-banner {
        z-index: 1;
        inset-block-start: auto;
        inset-block-end: 0;
      }
      #terminal-screen {
        flex: 1;
        min-height: 0;
        padding: 0.25rem 0.5rem;
      }
      .term-head {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.35rem 0.5rem;
      }
      .term-head h3 {
        margin: 0;
        font-size: 0.9rem;
      }
      .term-state {
        flex: 1;
        opacity: 0.8;
      }
      /* What the shell is doing, at a glance: amber while the host is asked,
         green while it runs, red when it was refused, grey once it is over
         (ADR 0132). The words beside it stay the whole message. */
      .term-state::before {
        content: '';
        display: inline-block;
        width: 0.5rem;
        height: 0.5rem;
        margin-inline-end: 0.4rem;
        border-radius: 50%;
        background: #7a8293;
      }
      .term-state[data-status='opening']::before {
        background: #f2b441;
        animation: term-pulse 0.9s ease-in-out infinite alternate;
      }
      .term-state[data-status='open']::before {
        background: #3ccf8e;
      }
      .term-state[data-status='refused']::before {
        background: #ff6d7b;
      }
      /* The terminal's right-click menu (ADR 0132): fixed, because it opens
         at the pointer, and in the terminal's own palette. */
      .term-menu {
        position: fixed;
        z-index: 10;
        display: flex;
        flex-direction: column;
        min-width: 11rem;
        padding: 0.25rem;
        background: #1b1f27;
        border: 1px solid #373e4b;
        border-radius: 8px;
        box-shadow: 0 8px 20px -6px rgb(0 0 0 / 55%);
        font-size: 0.85rem;
      }
      .term-menu-item {
        display: flex;
        justify-content: space-between;
        gap: 1.5rem;
        padding: 0.35rem 0.6rem;
        border: 0;
        border-radius: 5px;
        background: none;
        color: #e9ecf2;
        font: inherit;
        text-align: start;
      }
      .term-menu-item:hover:not(:disabled),
      .term-menu-item:focus-visible {
        background: rgb(255 255 255 / 8%);
        outline: none;
      }
      .term-menu-item:disabled {
        color: #5e6676;
      }
      .term-menu-item kbd {
        font: inherit;
        color: #8d95a5;
      }
      @keyframes term-pulse {
        to {
          opacity: 0.3;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .term-state[data-status='opening']::before {
          animation: none;
        }
      }
      .chat-log {
        flex: 1;
        overflow-y: auto;
        margin: 0;
        padding: 0.5rem;
        list-style: none;
      }
      .chat-row {
        margin-block: 0.15rem;
        overflow-wrap: anywhere;
      }
      .chat-out {
        text-align: end;
        color: #9fd0ff;
      }
      .chat-in {
        text-align: start;
        color: #f2f2f5;
      }
      .chat-compose {
        display: flex;
        gap: 0.25rem;
        padding: 0.35rem;
        border-block-start: 1px solid rgb(255 255 255 / 18%);
      }
      .chat-input {
        flex: 1;
        min-width: 0;
        background: #1c1c22;
        color: inherit;
        border: 1px solid rgb(255 255 255 / 25%);
        border-radius: 0.25rem;
        padding: 0.25rem 0.4rem;
      }
      .chat-send {
        background: #2b2b33;
        color: inherit;
        border: 1px solid rgb(255 255 255 / 25%);
        border-radius: 0.25rem;
        padding: 0.25rem 0.6rem;
      }
      .view-modal {
        position: absolute;
        inset: 0;
        margin: auto;
        width: min(28rem, 90%);
        height: fit-content;
        padding: 1.5rem;
        border-radius: 0.5rem;
        background: #1c1c22;
        box-shadow: 0 0 0 100vmax rgb(0 0 0 / 60%);
      }
      #cursor {
        position: absolute;
        inset-block-start: 0;
        inset-inline-start: 0;
        z-index: 20;
        /* Purely decorative: every event under it belongs to the picture. */
        pointer-events: none;
        image-rendering: pixelated;
      }
      #cursor[hidden] {
        display: none;
      }
      /* Floating session toolbar (§11). Sits on top of the picture, follows
         the drag handle, and collapses to a single pill. */
      #toolbar-root {
        position: absolute;
        z-index: 30;
      }
      /* Full screen hides the window chrome, so the toolbar is the only way
         back out with a pointer: it fades rather than disappears, and comes
         back on hover or on focus. Never `display: none` or `visibility:
         hidden` — either would take it out of hit testing and out of the tab
         order, which is exactly the trap this avoids. */
      #toolbar-root.is-autohide {
        opacity: 0.08;
        transition: opacity 0.15s ease;
      }
      #toolbar-root.is-autohide:hover,
      #toolbar-root.is-autohide:focus-within {
        opacity: 1;
      }
      @media (prefers-reduced-motion: reduce) {
        #toolbar-root.is-autohide {
          transition: none;
        }
      }
      .toolbar-pop-heading {
        margin: 0.7rem 0 0.3rem;
        font-size: 0.8rem;
        font-weight: 600;
      }
      .toolbar-hotkeys {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 0.15rem 0.6rem;
        margin: 0;
        font-size: 0.75rem;
      }
      .toolbar-hotkeys dt {
        color: #9fd0ff;
        white-space: nowrap;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .toolbar-hotkeys dd {
        margin: 0;
        color: #d6d6dd;
      }
      .toolbar {
        display: inline-flex;
        align-items: center;
        gap: 0.15rem;
        padding: 0.2rem;
        background: rgb(16 16 20 / 88%);
        border: 1px solid rgb(255 255 255 / 18%);
        border-radius: 0.5rem;
        box-shadow: 0 2px 10px rgb(0 0 0 / 45%);
      }
      .toolbar-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 2rem;
        height: 2rem;
        padding: 0;
        background: transparent;
        color: #f2f2f5;
        border: none;
        border-radius: 0.35rem;
        cursor: pointer;
      }
      .toolbar-btn:hover:not(.is-disabled) {
        background: rgb(255 255 255 / 12%);
      }
      .toolbar-btn:focus-visible {
        outline: 2px solid #9fd0ff;
        outline-offset: 1px;
      }
      .toolbar-btn.is-active {
        background: rgb(159 208 255 / 22%);
      }
      .toolbar-btn.is-disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      /* The transient "a clipboard just synced" note, next to the toolbar
         (§15: the fact only, never the content). */
      .toolbar-clipboard-note {
        display: inline-flex;
        align-items: center;
        margin-inline-start: 0.2rem;
        padding: 1px 8px;
        border: 1px solid rgb(255 255 255 / 18%);
        border-radius: 999px;
        background: rgb(16 16 20 / 88%);
        color: #9fd0ff;
        font-size: 0.7rem;
        white-space: nowrap;
      }
      .toolbar-handle {
        cursor: grab;
      }
      .toolbar-handle:active {
        cursor: grabbing;
      }
      .toolbar svg {
        width: 1.1rem;
        height: 1.1rem;
        pointer-events: none;
      }
      .toolbar-pop {
        position: absolute;
        inset-block-start: calc(100% + 0.4rem);
        inset-inline-start: 0;
        min-width: 12rem;
        padding: 0.6rem;
        background: rgb(16 16 20 / 96%);
        border: 1px solid rgb(255 255 255 / 18%);
        border-radius: 0.5rem;
        box-shadow: 0 2px 10px rgb(0 0 0 / 45%);
        font-size: 0.85rem;
      }
      .toolbar-pop-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.5rem;
      }
      /* Asking the host to go down (ADR 0084). Side by side and equally
         weighted: a restart and a shutdown are different decisions, and
         making one of them the quiet secondary would be this side deciding
         which the person meant. Red, because both end the session. */
      .toolbar-power {
        gap: 0.4rem;
      }
      .toolbar-power button {
        flex: 1;
        padding: 0.35rem 0.5rem;
        background: rgb(255 90 90 / 16%);
        color: #ffb3b3;
        border: 1px solid rgb(255 90 90 / 45%);
        border-radius: 0.25rem;
        cursor: pointer;
        font-size: 0.8rem;
        line-height: 1.2;
      }
      .toolbar-power button:hover {
        background: rgb(255 90 90 / 28%);
      }
      .toolbar-power button:focus-visible {
        outline: 2px solid #9fd0ff;
        outline-offset: 1px;
      }
      /* The zoom stepper, shown only while the picture size is "Zoom". */
      .toolbar-zoom {
        display: inline-flex;
        align-items: center;
        gap: 0.3rem;
      }
      .toolbar-zoom button {
        width: 1.4rem;
        height: 1.4rem;
        padding: 0;
        background: rgb(255 255 255 / 10%);
        color: inherit;
        border: none;
        border-radius: 0.25rem;
        cursor: pointer;
        line-height: 1;
      }
      .toolbar-zoom button:hover {
        background: rgb(255 255 255 / 20%);
      }
      .toolbar-zoom button:focus-visible {
        outline: 2px solid #9fd0ff;
        outline-offset: 1px;
      }
      .toolbar-zoom output {
        min-width: 3.2rem;
        text-align: center;
        font-variant-numeric: tabular-nums;
      }
      .toolbar-pop-note {
        margin: 0.5rem 0 0;
        color: #9a9aa5;
        font-size: 0.75rem;
      }
      .toolbar-monitor-list {
        margin: 0;
        padding: 0;
        list-style: none;
        display: grid;
        gap: 0.25rem;
      }
      .toolbar-monitor-size {
        color: #9a9aa5;
        margin-inline-start: 0.4rem;
        font-size: 0.75rem;
      }
      .toolbar-monitor-list button {
        width: 100%;
        text-align: start;
        padding: 0.35rem 0.5rem;
        background: transparent;
        color: inherit;
        border: 1px solid transparent;
        border-radius: 0.35rem;
        cursor: pointer;
      }
      .toolbar-monitor-list button:hover {
        background: rgb(255 255 255 / 12%);
      }
      .toolbar-monitor-list button.is-active {
        border-color: #9fd0ff;
      }
    </style>
  </head>
  <body>
    <main id="view">
      <canvas id="screen" width="1" height="1"></canvas>
      <!-- The host's cursor, drawn locally at the local pointer (§11). Its own
           layer rather than the video canvas: drawn into that one it would
           have to be erased by hand on every frame, and it is hidden outright
           on a host that still draws the cursor into the picture. -->
      <canvas id="cursor" width="1" height="1" aria-hidden="true" hidden></canvas>
      <div id="overlay"></div>
      <div id="recording-indicator"></div>
      <!-- Video statistics (Ctrl+Alt+Shift+S): hidden until asked for. -->
      <div id="stats-overlay" hidden></div>
      <aside id="chat-panel" class="chat-panel" hidden></aside>
      <!-- The terminal (ADR 0079). Two elements rather than one: `xterm.js`
           owns `#terminal-screen` outright and a re-render would destroy it,
           so the chrome around it is drawn into its own sibling. -->
      <aside id="terminal-panel" aria-labelledby="term-heading" hidden>
        <div id="terminal-chrome"></div>
        <div id="terminal-screen"></div>
      </aside>
      <div id="toolbar-root"></div>
    </main>
    <script type="module" src="/src/view.ts"></script>
  </body>
</html>
