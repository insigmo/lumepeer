<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lumepeer — remote screen</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #101014;
        color: #f2f2f5;
        font-family: system-ui, sans-serif;
      }
      #view {
        position: relative;
        height: 100%;
        display: grid;
        place-items: center;
        /* A picture at 1:1 or zoomed in is wider than the window on purpose;
           panning is how it is reached (§11), so the overflow is clipped
           rather than turned into scrollbars over the remote screen. */
        overflow: hidden;
        /* Middle-button drag pans. Without this the browser's own autoscroll
           takes the gesture first and the pan never happens. */
        overscroll-behavior: contain;
      }
      #screen {
        /* Sized in CSS pixels by `applyLayout`, which is also why these two
           are only a starting point: the canvas *buffer* stays at the frame's
           own resolution so `putImageData` never has to scale (§11). */
        max-width: 100%;
        max-height: 100%;
        /* The remote screen is already the picture; smoothing a 1:1 blit only
           costs time. */
        image-rendering: pixelated;
        /* The ordinary arrow. Pointer motion is sent as an absolute position
           normalized to this canvas, so the local pointer sits exactly where
           the click will land on the host and hiding it outright would leave
           the operator aiming blind. `view.ts` overrides this with `none` for
           the one state that has its own pointer to show — the host's shape
           drawn on the `#cursor` layer (ADR 0038) — and puts it back the
           moment that stops being true. It used to be a crosshair, from before
           that layer existed and the host's cursor was only ever composited
           into the picture; with the layer, a crosshair is the second cursor
           on screen. */
        cursor: default;
      }
      .view-banner {
        position: absolute;
        inset-inline: 0;
        inset-block-start: 0;
        margin: 0;
        padding: 0.5rem 1rem;
        background: rgb(0 0 0 / 70%);
        text-align: center;
      }
      /* Recording indicator (§17). Top-centre, above everything, and with no
         way to dismiss it: an indicator someone can put away is not one. */
      .view-recording {
        position: absolute;
        inset-inline: 0;
        inset-block-start: 0;
        z-index: 40;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.4rem;
        margin: 0;
        padding: 0.35rem 1rem;
        background: rgb(150 20 30 / 88%);
        font-size: 0.85rem;
        font-weight: 600;
        pointer-events: none;
      }
      .view-recording-dot {
        width: 0.6rem;
        height: 0.6rem;
        border-radius: 50%;
        background: #ff5a5a;
        box-shadow: 0 0 0.4rem #ff5a5a;
      }
      #chat-panel {
        position: absolute;
        inset-block-end: 0;
        inset-inline-end: 0;
        width: min(20rem, 40vw);
        max-height: 45%;
        display: flex;
        flex-direction: column;
        background: rgb(0 0 0 / 72%);
        border-start-start-radius: 0.5rem;
        font-size: 0.85rem;
      }
      /* Without this the panel cannot be hidden at all: the browser's own
         `[hidden] { display: none }` is specificity (0,1,0) and loses to the
         `#chat-panel` rule above, so `hidden = true` would leave it laid out
         and on screen. Same reason `#cursor[hidden]` below exists. */
      #chat-panel[hidden] {
        display: none;
      }
      .chat-log {
        flex: 1;
        overflow-y: auto;
        margin: 0;
        padding: 0.5rem;
        list-style: none;
      }
      .chat-row {
        margin-block: 0.15rem;
        overflow-wrap: anywhere;
      }
      .chat-out {
        text-align: end;
        color: #9fd0ff;
      }
      .chat-in {
        text-align: start;
        color: #f2f2f5;
      }
      .chat-compose {
        display: flex;
        gap: 0.25rem;
        padding: 0.35rem;
        border-block-start: 1px solid rgb(255 255 255 / 18%);
      }
      .chat-input {
        flex: 1;
        min-width: 0;
        background: #1c1c22;
        color: inherit;
        border: 1px solid rgb(255 255 255 / 25%);
        border-radius: 0.25rem;
        padding: 0.25rem 0.4rem;
      }
      .chat-send {
        background: #2b2b33;
        color: inherit;
        border: 1px solid rgb(255 255 255 / 25%);
        border-radius: 0.25rem;
        padding: 0.25rem 0.6rem;
      }
      .view-modal {
        position: absolute;
        inset: 0;
        margin: auto;
        width: min(28rem, 90%);
        height: fit-content;
        padding: 1.5rem;
        border-radius: 0.5rem;
        background: #1c1c22;
        box-shadow: 0 0 0 100vmax rgb(0 0 0 / 60%);
      }
      #cursor {
        position: absolute;
        inset-block-start: 0;
        inset-inline-start: 0;
        z-index: 20;
        /* Purely decorative: every event under it belongs to the picture. */
        pointer-events: none;
        image-rendering: pixelated;
      }
      #cursor[hidden] {
        display: none;
      }
      /* Floating session toolbar (§11). Sits on top of the picture, follows
         the drag handle, and collapses to a single pill. */
      #toolbar-root {
        position: absolute;
        z-index: 30;
      }
      /* Full screen hides the window chrome, so the toolbar is the only way
         back out with a pointer: it fades rather than disappears, and comes
         back on hover or on focus. Never `display: none` or `visibility:
         hidden` — either would take it out of hit testing and out of the tab
         order, which is exactly the trap this avoids. */
      #toolbar-root.is-autohide {
        opacity: 0.08;
        transition: opacity 0.15s ease;
      }
      #toolbar-root.is-autohide:hover,
      #toolbar-root.is-autohide:focus-within {
        opacity: 1;
      }
      @media (prefers-reduced-motion: reduce) {
        #toolbar-root.is-autohide {
          transition: none;
        }
      }
      .toolbar-pop-heading {
        margin: 0.7rem 0 0.3rem;
        font-size: 0.8rem;
        font-weight: 600;
      }
      .toolbar-hotkeys {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 0.15rem 0.6rem;
        margin: 0;
        font-size: 0.75rem;
      }
      .toolbar-hotkeys dt {
        color: #9fd0ff;
        white-space: nowrap;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .toolbar-hotkeys dd {
        margin: 0;
        color: #d6d6dd;
      }
      .toolbar {
        display: inline-flex;
        align-items: center;
        gap: 0.15rem;
        padding: 0.2rem;
        background: rgb(16 16 20 / 88%);
        border: 1px solid rgb(255 255 255 / 18%);
        border-radius: 0.5rem;
        box-shadow: 0 2px 10px rgb(0 0 0 / 45%);
      }
      .toolbar-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 2rem;
        height: 2rem;
        padding: 0;
        background: transparent;
        color: #f2f2f5;
        border: none;
        border-radius: 0.35rem;
        cursor: pointer;
      }
      .toolbar-btn:hover:not(.is-disabled) {
        background: rgb(255 255 255 / 12%);
      }
      .toolbar-btn:focus-visible {
        outline: 2px solid #9fd0ff;
        outline-offset: 1px;
      }
      .toolbar-btn.is-active {
        background: rgb(159 208 255 / 22%);
      }
      .toolbar-btn.is-disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      .toolbar-handle {
        cursor: grab;
      }
      .toolbar-handle:active {
        cursor: grabbing;
      }
      .toolbar svg {
        width: 1.1rem;
        height: 1.1rem;
        pointer-events: none;
      }
      .toolbar-pop {
        position: absolute;
        inset-block-start: calc(100% + 0.4rem);
        inset-inline-start: 0;
        min-width: 12rem;
        padding: 0.6rem;
        background: rgb(16 16 20 / 96%);
        border: 1px solid rgb(255 255 255 / 18%);
        border-radius: 0.5rem;
        box-shadow: 0 2px 10px rgb(0 0 0 / 45%);
        font-size: 0.85rem;
      }
      .toolbar-pop-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.5rem;
      }
      .toolbar-pop-note {
        margin: 0.5rem 0 0;
        color: #9a9aa5;
        font-size: 0.75rem;
      }
      .toolbar-monitor-list {
        margin: 0;
        padding: 0;
        list-style: none;
        display: grid;
        gap: 0.25rem;
      }
      .toolbar-monitor-size {
        color: #9a9aa5;
        margin-inline-start: 0.4rem;
        font-size: 0.75rem;
      }
      .toolbar-monitor-list button {
        width: 100%;
        text-align: start;
        padding: 0.35rem 0.5rem;
        background: transparent;
        color: inherit;
        border: 1px solid transparent;
        border-radius: 0.35rem;
        cursor: pointer;
      }
      .toolbar-monitor-list button:hover {
        background: rgb(255 255 255 / 12%);
      }
      .toolbar-monitor-list button.is-active {
        border-color: #9fd0ff;
      }
    </style>
  </head>
  <body>
    <main id="view">
      <canvas id="screen" width="1" height="1"></canvas>
      <!-- The host's cursor, drawn locally at the local pointer (§11). Its own
           layer rather than the video canvas: drawn into that one it would
           have to be erased by hand on every frame, and it is hidden outright
           on a host that still draws the cursor into the picture. -->
      <canvas id="cursor" width="1" height="1" aria-hidden="true" hidden></canvas>
      <div id="overlay"></div>
      <div id="recording-indicator"></div>
      <aside id="chat-panel" class="chat-panel" hidden></aside>
      <div id="toolbar-root"></div>
    </main>
    <script type="module" src="/src/view.ts"></script>
  </body>
</html>
