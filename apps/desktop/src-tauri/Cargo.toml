[package]
name = "lumepeer-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true
description = "Lumepeer desktop host and viewer"

[[bin]]
name = "lumepeer-desktop"
path = "src/main.rs"

[lints]
workspace = true

[features]
default = []
# Pass-throughs onto `lumepeer-media`'s platform backends. Default is empty so
# `cargo build --workspace` still needs no platform SDK; a real host build turns
# on the ones its target has (e.g. `--features capture-x11,encode-openh264` on
# X11 Linux, or automatically on Linux via the target-specific dependency table
# below). Without any of them the app runs, pairs and consents normally and
# reports "no capture backend" instead of showing a picture (§18).
capture-x11 = ["lumepeer-media/capture-x11"]
capture-portal = ["lumepeer-media/capture-portal"]
capture-scap = ["lumepeer-media/capture-scap"]
capture-windows = ["lumepeer-media/capture-windows"]
capture-screencapturekit = ["lumepeer-media/capture-screencapturekit"]
encode-openh264 = ["lumepeer-media/encode-openh264"]
encode-mf = ["lumepeer-media/encode-mf"]
decode-openh264 = ["lumepeer-media/decode-openh264"]
# Off by default: never part of `cargo build --workspace`, the Task client
# builds, or the release CI matrix. Opt in locally with
# `cargo build --features pilot` to get tauri-pilot wired in for
# cross-platform UI debugging; main.rs additionally gates it on
# `debug_assertions` so it cannot end up in a release binary even if this
# feature were mistakenly enabled for one.
pilot = ["dep:tauri-plugin-pilot"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
arboard.workspace = true
lumepeer-core.workspace = true
lumepeer-net = { workspace = true, features = ["secret-service", "keyring"] }
lumepeer-media = { workspace = true, features = ["audio-opus", "audio-capture"] }
ed25519-dalek.workspace = true
iroh.workspace = true
postcard.workspace = true
rand.workspace = true
tauri.workspace = true
tauri-plugin-dialog.workspace = true
tauri-plugin-updater.workspace = true
tauri-plugin-pilot = { version = "0.7.2", optional = true }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# Linux gets real capture unconditionally rather than through the
# capture-x11 pass-through above, so a Linux build never has to remember to
# ask for it. Windows and macOS builds do need `--features capture-windows`
# / `--features capture-screencapturekit` explicitly (see Taskfile.yml) —
# unlike x11rb, the `windows`/`objc2` bindings those pull in are large enough
# that making them unconditional here would slow down every Windows/macOS
# build, including ones that never touch capture.
[target.'cfg(target_os = "linux")'.dependencies]
lumepeer-media = { workspace = true, features = ["capture-x11"] }
