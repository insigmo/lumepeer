<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lumepeer — remote terminal</title>
    <link rel="stylesheet" href="/src/tokens.css" />
    <link rel="stylesheet" href="/src/terminal-chrome.css" />
    <style>
      /* Follows the app's light or dark (ADR 0168); the shell's palette is
         terminal.ts's, matched to --term-bg. */
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--term-bg);
        color: var(--text);
        font-family: var(--font-ui);
        -webkit-font-smoothing: antialiased;
      }
      /* The shell is the window (ADR 0131), laid out like the terminal-only
         view window of ADR 0101: its own header on top, the emulator below
         taking everything that is left. */
      #terminal {
        height: 100%;
        display: flex;
        flex-direction: column;
        font-size: 0.85rem;
      }
      #terminal-screen {
        flex: 1;
        min-height: 0;
        padding: 0.35rem 0.6rem;
      }
    </style>
  </head>
  <body>
    <!-- A terminal window beside a session that already has a window of its
         own (ADR 0131). Two elements, as in view.html: `xterm.js` owns
         `#terminal-screen` outright and a re-render would destroy it, so the
         header is drawn into its own element. Filled by terminal-window.ts. -->
    <main id="terminal" aria-labelledby="term-heading">
      <div id="terminal-chrome"></div>
      <div id="terminal-screen"></div>
    </main>
    <script type="module" src="/src/terminal-window.ts"></script>
  </body>
</html>
