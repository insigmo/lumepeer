<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lumepeer</title>
    <link rel="stylesheet" href="/src/tokens.css" />
    <style>
      /* The bar has no window chrome and no scrollbars of its own: it is a
         small always-on-top card over somebody's desktop, and every pixel it
         takes is one it took from the application underneath. It follows the
         app's light or dark like every other window (ADR 0168). */
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: transparent;
        color: var(--text);
        font-family: var(--font-ui);
        font-size: 12px;
        -webkit-font-smoothing: antialiased;
        /* Nothing here is a document to select from, and a stray drag that
           highlights the peer label instead of moving the window is the one
           thing a drag handle must not do. */
        user-select: none;
      }
      #hostbar {
        display: flex;
        flex-direction: column;
        height: 100%;
        box-sizing: border-box;
        padding: 8px 10px 10px;
        background: var(--raised);
        /* An inset edge in the theme's own hairline, never a light outline:
           on the transparent window macOS and Linux give the bar, a light
           border read as a white ring round a dark card. */
        box-shadow: inset 0 0 0 1px var(--border);
        border-radius: 12px;
      }
      /* Collapsed: the tab is the whole window, so the padding and the
         rounding on the docked edge both go away. */
      #hostbar.is-collapsed {
        padding: 0;
        border-radius: 8px;
        justify-content: center;
        align-items: center;
      }
      .bar-head {
        display: flex;
        align-items: center;
        gap: 7px;
        /* The drag handle. Everything on this row carries
           data-tauri-drag-region, so the bar moves from its whole header
           rather than from one invisible strip of it. */
        cursor: grab;
      }
      .bar-head:active {
        cursor: grabbing;
      }
      .bar-mark svg {
        display: block;
        width: 18px;
        height: 18px;
        border-radius: 22%;
        box-shadow: 0 0 0 1px var(--logo-ring);
      }
      .bar-name {
        flex: 1;
        font-weight: 600;
        font-size: 13px;
      }
      .tab-btn {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 20px;
        height: 20px;
        padding: 0;
        background: transparent;
        color: var(--text-2);
        border: none;
        border-radius: var(--radius-key);
        cursor: pointer;
      }
      #hostbar.is-collapsed .tab-btn {
        width: 100%;
        height: 100%;
        border-radius: 0;
      }
      .tab-btn:hover {
        background: var(--hover-strong);
        color: var(--text);
      }
      .tab-btn:focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: -2px;
      }
      .tab-btn svg {
        width: 13px;
        height: 13px;
      }
      /* Unread chat, on the collapsed tab: the same amber as the mark on the
         row and on the guest's toolbar. */
      .tab-dot {
        position: absolute;
        inset-block-start: 5px;
        inset-inline-start: 50%;
        width: 8px;
        height: 8px;
        margin-inline-start: -4px;
        border-radius: 50%;
        background: var(--amber-dot);
      }
      /* A legend, printed small and lowercase like every legend in the app. */
      .bar-heading {
        margin: 8px 0 2px;
        color: var(--text-3);
        font-size: 11px;
        font-weight: 500;
        text-transform: lowercase;
      }
      .bar-list {
        flex: 1;
        min-height: 0;
        margin: 0;
        padding: 0;
        list-style: none;
        overflow-y: auto;
        scrollbar-width: thin;
        scrollbar-color: var(--scrollbar) transparent;
      }
      .bar-row {
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 3px 0;
      }
      .bar-row + .bar-row {
        border-block-start: 1px solid var(--border);
      }
      /* The guest's on-light: lit green, with the halo a live session has
         everywhere in the app. */
      .bar-dot {
        flex: none;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--green);
        box-shadow: 0 0 0 3px var(--green-soft);
      }
      .bar-peer {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-family: var(--font-mono);
      }
      /* A machine name is words, not an identifier (ADR 0121). */
      .bar-peer[data-named='true'] {
        font-family: inherit;
        font-weight: 600;
      }
      .bar-role {
        flex: none;
        color: var(--text-3);
        font-size: 11px;
      }
      /* A shell running on this machine (ADR 0079 decision 3). Red, like
         every other "this is happening right now" mark, and nothing hides
         it. */
      .bar-terminal {
        flex: none;
        display: flex;
        color: var(--red);
      }
      /* Ending a guest's session is the stop key: red, round-ended. */
      .bar-revoke {
        flex: none;
        padding: 2px 8px;
        background: transparent;
        color: var(--red);
        border: 1px solid var(--red);
        border-radius: var(--radius-key);
        font: inherit;
        font-size: 11px;
        font-weight: 600;
        cursor: pointer;
      }
      .bar-revoke:hover {
        background: var(--red-soft);
      }
      .bar-chat {
        flex: none;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 24px;
        height: 20px;
        padding: 0;
        background: var(--amber-soft);
        color: var(--text);
        border: 1px solid var(--amber-dot);
        border-radius: var(--radius-key);
        cursor: pointer;
      }
      .bar-chat:hover {
        background: var(--accent-soft-strong);
      }
      .bar-chat svg {
        width: 14px;
        height: 14px;
      }
      .bar-revoke:focus-visible,
      .bar-chat:focus-visible,
      .bar-open:focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 1px;
      }
      .bar-open {
        margin-block-start: 6px;
        min-height: 28px;
        padding: 4px 10px;
        background: var(--control-bg);
        color: var(--text);
        border: 1px solid var(--border-strong);
        border-radius: var(--radius-key);
        box-shadow: var(--shadow-sm);
        font: inherit;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
      }
      .bar-open:hover {
        background: var(--surface-2);
      }
    </style>
  </head>
  <body>
    <div id="hostbar"></div>
    <script type="module" src="/src/hostbar.ts"></script>
  </body>
</html>
