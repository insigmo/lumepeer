# Base configuration (design doc §5.1).
# Override locally with config/local.toml, which is gitignored and must never
# hold secrets that belong in the OS keystore (§11.2).

[runtime]
# tokio worker threads are capped explicitly rather than defaulting to the core
# count (§5.1).
max_worker_threads = 4

[network]
# Relay fallback is part of the Iroh defaults; direct connections are preferred.
# Setting this to false clears the direct IP transports outright, so every
# packet of every session goes through a relay — the WAN test of ADR 0020, and
# never a shipping default: it makes the session depend on one relay link
# staying healthy (ADR 0026).
prefer_direct = true
# Relay peers fall back to when hole punching fails. Unset means iroh's public
# fleet. Point it at your own relay (docs/relay-deployment.md) when the public
# one is not reachable from where your clients are:
# relay_url = "https://relay.example.com"

[logging]
# Human-readable on stdout in development, structured JSON to file in
# production; rotation follows LOG_ROTATION_DAYS / LOG_ROTATION_MAX_MIB (§16.1).
format = "auto"
# Relative paths are resolved under the per-user data directory, not the
# working directory: an installed client is started from a directory it may
# not write to. Windows: %LOCALAPPDATA%\io.insigmo.lumepeer\logs.
directory = "logs"

[license]
broker_base_url = "https://broker.invalid"

[ui]
# The consent screen must render instantly even on weak hardware (§5.1).
locale = "en"

[updates]
# Which stream of releases this client updates from (ADR 0042). "stable" takes
# only released builds; "beta" also takes prereleases, and moving a machine
# onto it is meant to be a deliberate edit, never a default.
#
# Signature checking is not affected by this setting: an artifact whose
# signature does not verify against the public key in tauri.conf.json is
# refused on both channels, and there is no unsigned fallback (§21).
channel = "stable"
# Where update manifests are fetched from, without a trailing slash. Unset
# means this project's own GitHub releases. Point it at your own server when
# you build and distribute lumepeer yourself; it must be https, and the
# artifacts must be signed with the key pairing the pubkey in tauri.conf.json.
# manifest_base_url = "https://updates.example.com/lumepeer"
