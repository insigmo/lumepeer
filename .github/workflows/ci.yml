name: ci

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  CMAKE_POLICY_VERSION_MINIMUM: 3.5

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  ui:
    name: ui (i18n + accessibility)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm install
        working-directory: apps/desktop
      - run: npm run typecheck
        working-directory: apps/desktop
      - run: npm test
        working-directory: apps/desktop
      - run: npm run ipc-contract
        working-directory: apps/desktop

  media:
    name: media backends (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm xvfb libx11-dev libxtst-dev libdbus-1-dev gnome-keyring libpipewire-0.3-dev libclang-dev libva-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p lumepeer-media --all-targets --features capture-x11,encode-openh264 -- -D warnings
      - run: cargo build -p lumepeer-decoder-worker
      - run: cargo clippy -p lumepeer-media --all-targets --features capture-portal -- -D warnings
      - run: cargo clippy -p lumepeer-net --all-targets --features secret-service -- -D warnings
      - name: Clippy the whole shipped Linux feature set
        run: cargo clippy -p lumepeer-media --all-targets --features capture-x11,capture-portal,encode-vaapi-zero-copy,encode-openh264,encode-aom,audio-opus,audio-capture-pipewire -- -D warnings
      # Software AV1 (ADR 0141): the vendored libaom builds from source with
      # its assembly, encodes, and a host and a guest negotiate it, follow the
      # preset off it and back. Then the two things a release must never do
      # quietly: build without nasm, or link without the assembly.
      - name: Clippy and test software AV1
        run: |
          cargo clippy -p lumepeer-aom-sys --all-targets -- -D warnings
          cargo clippy -p lumepeer-runtime --all-targets --features encode-aom -- -D warnings
          cargo test -p lumepeer-media --features encode-aom --lib encode::
          cargo test -p lumepeer-runtime --features encode-aom --lib software_av1
      - name: A build without nasm fails rather than losing libaom's assembly
        run: |
          if NASM=/nonexistent/nasm CARGO_TARGET_DIR=target/no-nasm cargo build -p lumepeer-aom-sys 2> no-nasm.log; then
            echo "::error::lumepeer-aom-sys built without nasm"
            exit 1
          fi
          grep -q "nasm not found" no-nasm.log
      - name: The test binary carries libaom's assembly
        run: |
          BIN="$(cargo test -p lumepeer-runtime --features encode-aom --lib --no-run --message-format=json \
            | jq -r 'select(.profile.test == true and .executable != null) | .executable' | head -1)"
          python3 ci/find-libaom-asm.py "target/debug/build/lumepeer-aom-sys-*/out/build" "${BIN}"
      - name: Clippy and test the VA-API encoder
        run: |
          cargo clippy -p lumepeer-media --all-targets --features encode-vaapi -- -D warnings
          cargo test -p lumepeer-media --features encode-vaapi,encode-openh264 --lib encode::
      - name: Clippy and test the zero-copy VA-API path
        run: |
          cargo clippy -p lumepeer-media --all-targets --features capture-x11,capture-portal,encode-vaapi-zero-copy,encode-openh264,audio-opus,audio-capture-pipewire,encode-vaapi-zero-copy -- -D warnings
          cargo test -p lumepeer-media --features encode-vaapi-zero-copy,encode-openh264 --lib
      - name: Test the media pipeline under Xvfb
        run: xvfb-run -a env LUMEPEER_TEST_XTEST=1 cargo test -p lumepeer-media --features capture-x11,capture-portal,encode-vaapi-zero-copy,encode-openh264,audio-opus,audio-capture-pipewire
      - name: Capture, encode and sandboxed decode end to end
        run: xvfb-run -a cargo test -p lumepeer-integration-tests --test media_pipeline
      - name: Error matrix (§18)
        run: xvfb-run -a cargo test -p lumepeer-integration-tests --test error_matrix
      - name: Keystore against a session keyring
        run: dbus-run-session -- cargo test -p lumepeer-net --features secret-service

  fuzz:
    name: fuzz targets build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --manifest-path tests/fuzz/Cargo.toml

  supply-chain:
    name: audit, deny and SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny,cargo-cyclonedx
      - run: cargo audit
      - run: cargo deny check
      - run: cargo cyclonedx --all --format json
      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: '**/*.cdx.json'
          retention-days: 90
