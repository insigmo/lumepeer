name: ci

# A push to `master` is tested inside `release.yml`, which calls this workflow
# (`workflow_call`) and cuts no version until every job here is green. Running
# it here as well would build the whole matrix twice per push, so `master` is
# left out of `push`; every other branch, every pull request and a manual run
# still get it on their own.
on:
  push:
    branches-ignore: [master]
  pull_request:
  workflow_call:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  CMAKE_POLICY_VERSION_MINIMUM: 3.5

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  # Design doc §19 phase 0: the workspace builds, is clippy-clean and passes
  # its tests on Windows, Linux and macOS. `eb90617` dropped this job on
  # 2026-09-17, and for seven weeks nothing ran most of the workspace's tests
  # anywhere — while `release.yml` shipped every push regardless.
  #
  # Default features, plus whatever `--workspace` unifies in: the desktop
  # crate's per-OS tables (audio, X11, ScreenCaptureKit) and
  # `tests/integration`'s `capture-x11,capture-portal,encode-aom`. That last
  # one builds the vendored libaom, whose x86-64 build refuses to go on
  # without nasm (ADR 0141), so every row installs it.
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # The Linux row is the image `release.yml` ships from (pipewire 0.10,
        # libclang 22), not `ubuntu-latest`.
        os: [ubuntu-26.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # The desktop build's own list (release.yml), plus X11/XTest for
          # capture-x11 and D-Bus for the keystore's secret-service backend.
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libpipewire-0.3-dev libclang-dev libx11-dev libxtst-dev libdbus-1-dev nasm
      - name: Install nasm
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command nasm -ErrorAction SilentlyContinue)) {
            choco install nasm --no-progress -y
            "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
      # The Arm runner builds libaom's NEON kernels with the compiler alone,
      # but a missing nasm should never be why this row differs from the rest.
      - name: Install nasm
        if: runner.os == 'macOS'
        run: brew install nasm
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      # tauri-build reads frontendDist at compile time, so the webview bundle
      # has to exist before cargo runs.
      - run: npm install
        working-directory: apps/desktop
      - run: npm run build
        working-directory: apps/desktop
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # tauri-build validates `externalBin` at compile time: each sidecar must
      # exist as binaries/<name>-<target-triple><exe> before lumepeer-desktop
      # builds. The directory is gitignored, so it is produced here from the
      # same tree. The plain target/debug/lumepeer-decoder-worker this leaves
      # behind is also the worker `tests/integration/tests/media_pipeline.rs`
      # spawns.
      - name: Build the sidecars for this target
        shell: bash
        run: |
          TRIPLE=$(rustc -vV | awk '/^host:/ {print $2}')
          case "$RUNNER_OS" in
            Windows) EXE=.exe ;;
            *) EXE= ;;
          esac
          mkdir -p apps/desktop/src-tauri/binaries
          for BIN in lumepeer-decoder-worker lumepeer-service lumepeer-terminal-worker; do
            cargo build -p "${BIN}"
            cp "target/debug/${BIN}${EXE}" "apps/desktop/src-tauri/binaries/${BIN}-${TRIPLE}${EXE}"
          done
      # `--keep-going`, `--no-fail-fast` and the tests running after a red
      # clippy: one red run names every crate, lint and test binary that fails
      # on this OS, not just the first.
      - run: cargo clippy --workspace --all-targets --keep-going -- -D warnings
      - run: cargo test --workspace --no-fail-fast
        if: ${{ !cancelled() }}

  ui:
    name: ui (i18n + accessibility)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm install
        working-directory: apps/desktop
      - run: npm run typecheck
        working-directory: apps/desktop
      - run: npm test
        working-directory: apps/desktop
      - run: npm run ipc-contract
        working-directory: apps/desktop

  media:
    name: media backends (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm xvfb libx11-dev libxtst-dev libdbus-1-dev gnome-keyring libpipewire-0.3-dev libclang-dev libva-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p lumepeer-media --all-targets --features capture-x11,encode-aom -- -D warnings
      - run: cargo build -p lumepeer-decoder-worker
      - run: cargo clippy -p lumepeer-media --all-targets --features capture-portal -- -D warnings
      - run: cargo clippy -p lumepeer-net --all-targets --features secret-service -- -D warnings
      - name: Clippy the whole shipped Linux feature set
        run: cargo clippy -p lumepeer-media --all-targets --features capture-x11,capture-portal,encode-vaapi-zero-copy,encode-aom,decode-aom,audio-opus,audio-capture-pipewire -- -D warnings
      # Software AV1 (ADR 0141, ADR 0162): the vendored libaom builds from
      # source with its assembly, encodes and decodes, and a host and a guest
      # negotiate it — the guest's webview or its worker. Then the two things
      # a release must never do quietly: build without nasm, or link without
      # the assembly.
      - name: Clippy and test software AV1
        run: |
          cargo clippy -p lumepeer-aom-sys --all-targets -- -D warnings
          cargo clippy -p lumepeer-runtime --all-targets --features encode-aom -- -D warnings
          cargo test -p lumepeer-media --features encode-aom,decode-aom --lib -- encode:: decode::aom
          cargo test -p lumepeer-runtime --features encode-aom --lib -- codec software a_guest_picks a_restart_on_a_still_screen
      - name: A build without nasm fails rather than losing libaom's assembly
        run: |
          if NASM=/nonexistent/nasm CARGO_TARGET_DIR=target/no-nasm cargo build -p lumepeer-aom-sys --features vendored 2> no-nasm.log; then
            echo "::error::lumepeer-aom-sys built without nasm"
            exit 1
          fi
          grep -q "nasm not found" no-nasm.log
          # Without the feature the crate is inert, nasm or not: what keeps
          # `cargo build --workspace` free of platform SDKs.
          NASM=/nonexistent/nasm CARGO_TARGET_DIR=target/no-nasm cargo build -p lumepeer-aom-sys
      - name: The test binary carries libaom's assembly
        run: |
          BIN="$(cargo test -p lumepeer-runtime --features encode-aom --lib --no-run --message-format=json \
            | jq -r 'select(.profile.test == true and .executable != null) | .executable' | head -1)"
          python3 ci/find-libaom-asm.py "target/debug/build/lumepeer-aom-sys-*/out/build" "${BIN}"
      - name: Clippy and test the VA-API encoder
        run: |
          cargo clippy -p lumepeer-media --all-targets --features encode-vaapi -- -D warnings
          cargo test -p lumepeer-media --features encode-vaapi,encode-aom --lib encode::
      - name: Clippy and test the zero-copy VA-API path
        run: |
          cargo clippy -p lumepeer-media --all-targets --features capture-x11,capture-portal,encode-vaapi-zero-copy,encode-aom,audio-opus,audio-capture-pipewire,encode-vaapi-zero-copy -- -D warnings
          cargo test -p lumepeer-media --features encode-vaapi-zero-copy,encode-aom --lib
      - name: Test the media pipeline under Xvfb
        run: xvfb-run -a env LUMEPEER_TEST_XTEST=1 cargo test -p lumepeer-media --features capture-x11,capture-portal,encode-vaapi-zero-copy,encode-aom,audio-opus,audio-capture-pipewire
      - name: Capture, encode and sandboxed decode end to end
        run: xvfb-run -a cargo test -p lumepeer-integration-tests --test media_pipeline
      - name: Error matrix (§18)
        run: xvfb-run -a cargo test -p lumepeer-integration-tests --test error_matrix
      - name: Keystore against a session keyring
        run: dbus-run-session -- cargo test -p lumepeer-net --features secret-service

  fuzz:
    name: fuzz targets build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --manifest-path tests/fuzz/Cargo.toml

  supply-chain:
    name: audit, deny and SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny,cargo-cyclonedx
      - run: cargo audit
      - run: cargo deny check
      - run: cargo cyclonedx --all --format json
      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: '**/*.cdx.json'
          retention-days: 90
