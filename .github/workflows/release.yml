name: release

# Builds the desktop app for every platform/arch combination requested for
# distribution and attaches the bundles to a GitHub release. tauri.conf.json
# sets bundle.targets = "all", so each Linux job emits both .deb and .rpm in
# one pass; the matrix only needs to vary by OS/arch, not by package format.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Matches ci.yml: full debug info in the bundled release binaries buys
  # nothing and the dev/test-profile link step is prone to OOM on shared
  # runners (see ci.yml for the "Bus error" incident this works around).
  CARGO_PROFILE_RELEASE_DEBUG: "0"

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64 (deb/rpm)
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - name: linux-arm64 (deb/rpm)
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - name: windows-amd64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: windows-arm64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
          - name: macos-arm64
            os: macos-14
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: npm install
        working-directory: apps/desktop
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: 'Lumepeer ${{ github.ref_name }}'
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}
