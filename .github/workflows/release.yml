name: release

# Auto-release on every push to master (patch bump), or manually with a bump
# type. Manual tags (v*) still work and skip the bump. Version in Cargo.toml
# / package.json / tauri.conf.json is updated by CI (mirrors sarca's
# release.yml). tauri.conf.json sets bundle.targets = "all", so each Linux
# job emits both .deb and .rpm in one pass; the matrix only needs to vary by
# OS/arch, not by package format.
on:
  push:
    branches: ["master"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      bump:
        description: "Semver bump when releasing from a branch"
        type: choice
        options: [patch, minor, major]
        default: patch
      channel:
        description: >-
          Update channel this release is published to (ADR 0042). "beta" marks
          the GitHub release as a prerelease, which GitHub's own /releases/
          latest redirect skips, so a stable client never sees it; the manifest
          is then also published to the rolling `beta` release that beta
          clients poll.
        type: choice
        options: [stable, beta]
        default: stable

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Matches ci.yml: full debug info in the bundled release binaries buys
  # nothing and the dev/test-profile link step is prone to OOM on shared
  # runners (see ci.yml for the "Bus error" incident this works around).
  CARGO_PROFILE_RELEASE_DEBUG: "0"
  # Matches ci.yml: audiopus_sys (vendored libopus, `audio-opus`) declares
  # compatibility with CMake < 3.5, which CMake 4 refuses to configure.
  # Harmless under CMake 3.x. See the RUSTSEC-2026-0150 note in deny.toml.
  CMAKE_POLICY_VERSION_MINIMUM: 3.5

permissions:
  contents: write

jobs:
  # Skip auto-release for the bot commit that only bumps version files.
  guard:
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          set -uo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git log -1 --pretty=%s | grep -qE '^chore: release v'; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "Skipping version-bump commit"
            exit 0
          fi
          echo "proceed=true" >> "$GITHUB_OUTPUT"

  version:
    needs: [guard]
    if: needs.guard.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      channel: ${{ github.event_name == 'workflow_dispatch' && inputs.channel || 'stable' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve next version
        id: meta
        env:
          BUMP: ${{ github.event_name == 'workflow_dispatch' && inputs.bump || 'patch' }}
        run: |
          set -uo pipefail

          # Tag push: use the tag as-is, do not bump or commit.
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
            echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "Using existing tag ${TAG}"
            exit 0
          fi

          LATEST="$(git tag -l 'v*' --sort=-v:refname | head -1 || true)"
          if [[ -z "${LATEST}" ]]; then
            MAJOR=0; MINOR=0; PATCH=0
          else
            RAW="${LATEST#v}"
            IFS=. read -r MAJOR MINOR PATCH <<<"${RAW}"
            MAJOR=${MAJOR:-0}; MINOR=${MINOR:-0}; PATCH=${PATCH:-0}
          fi

          case "${BUMP}" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
            *) echo "Unknown bump: ${BUMP}" >&2; exit 1 ;;
          esac

          VERSION="${MAJOR}.${MINOR}.${PATCH}"
          TAG="v${VERSION}"

          if git rev-parse "${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists" >&2
            exit 1
          fi

          # Keep package manifests in sync with the release tag. GNU sed's
          # `0,/re/` range caps each substitution to the first match, in case
          # "version" ever appears again further down either file.
          sed -i "s/^version = \".*\"/version = \"${VERSION}\"/" Cargo.toml
          sed -i "0,/\"version\":/{s/\"version\": \"[^\"]*\"/\"version\": \"${VERSION}\"/}" apps/desktop/package.json
          sed -i "0,/\"version\":/{s/\"version\": \"[^\"]*\"/\"version\": \"${VERSION}\"/}" apps/desktop/src-tauri/tauri.conf.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml apps/desktop/package.json apps/desktop/src-tauri/tauri.conf.json
          git commit -m "chore: release ${TAG}"
          git tag "${TAG}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
          git push origin "${TAG}"

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Prepared ${TAG} (bump=${BUMP}, previous=${LATEST:-none})"

  build:
    needs: [guard, version]
    if: needs.guard.outputs.proceed == 'true'
    name: build (${{ matrix.name }})
    strategy:
      fail-fast: false
      # All 6 targets upload assets to the same GitHub release via
      # tauri-action; letting them all hit the release API at once is a
      # known source of intermittent 5xx ("No server is currently
      # available") on the asset-upload step. Capping concurrency here
      # trades a bit of wall-clock time for fewer flaky release runs.
      max-parallel: 3
      # `features` mirrors Taskfile.yml's *_MEDIA_FEATURES: the media
      # backends are behind Cargo features so `cargo build --workspace`
      # needs no platform SDK, which means a release build that forgets to
      # ask for them ships a client that pairs and consents normally and
      # then never produces a picture — the guest sits on "waiting for the
      # remote screen" until its recovery window elapses (§18).
      #
      # Windows carries *both* encoders on purpose. `encode-mf` is Media
      # Foundation, which needs a hardware encoder the machine may simply not
      # have; without the `encode-openh264` software fallback next to it,
      # `select_encoder` fails on such a host with "no usable encoder" and the
      # session stays blank forever. That is not hypothetical: it is what
      # v0.0.14 did on a desktop with no hardware H.264 encoder.
      matrix:
        include:
          - name: linux-amd64 (deb/rpm)
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            features: capture-x11,capture-portal,encode-openh264
          - name: linux-arm64 (deb/rpm)
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            features: capture-x11,capture-portal,encode-openh264
          - name: windows-amd64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            features: capture-windows,encode-mf,encode-openh264
          - name: windows-arm64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
            features: capture-windows,encode-mf,encode-openh264
          - name: macos-arm64
            os: macos-14
            target: aarch64-apple-darwin
            features: capture-screencapturekit,encode-openh264
          - name: macos-amd64
            os: macos-14
            target: x86_64-apple-darwin
            features: capture-screencapturekit,encode-openh264
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # libpipewire/libclang are what the capture-portal feature needs:
          # `pipewire-sys` links libpipewire-0.3 and generates its bindings
          # with bindgen, so both the library and libclang have to be here or
          # the Linux rows of this matrix fail to build (ADR 0039).
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev rpm libpipewire-0.3-dev libclang-dev
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # rust-toolchain.toml pins a specific channel, which shadows the
      # `stable` toolchain the action above installed as soon as cargo runs
      # inside this repo — so its `targets:` add lands on the wrong
      # toolchain for any job whose target isn't the runner's native arch
      # (only macos-amd64 today). Adding it again here targets whichever
      # toolchain actually resolves for this directory.
      - run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: npm install
        working-directory: apps/desktop
      # tauri-build validates `externalBin` at compile time: the sidecar must
      # exist as binaries/lumepeer-decoder-worker-<target-triple><exe> before
      # lumepeer-desktop builds. The directory is gitignored (build artifact),
      # so CI produces it here from the same source tree — same recipe as the
      # ci.yml build job, except it stages from a --target release build so
      # the macos-amd64 job on arm64 hardware bundles an x86_64 worker.
      - name: Build the sidecars for this target
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows) EXE=.exe ;;
            *) EXE= ;;
          esac
          # `lumepeer-service` is the privileged helper of ADR 0043. It is
          # staged for every target because `externalBin` is not per-platform;
          # off Windows the binary exits with an explanation, because there is
          # no privileged action there for a daemon to hold.
          mkdir -p apps/desktop/src-tauri/binaries
          for BIN in lumepeer-decoder-worker lumepeer-service; do
            cargo build --release -p "${BIN}" --target ${{ matrix.target }}
            cp "target/${{ matrix.target }}/release/${BIN}${EXE}"                "apps/desktop/src-tauri/binaries/${BIN}-${{ matrix.target }}${EXE}"
          done
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ needs.version.outputs.tag }}
          releaseName: 'Lumepeer ${{ needs.version.outputs.tag }}'
          releaseDraft: false
          # A beta is a GitHub prerelease. That is not cosmetic: the
          # /releases/latest redirect the stable manifest is fetched through
          # skips prereleases outright, so a stable client is never *shown* a
          # beta rather than merely asked not to take one (ADR 0042).
          prerelease: ${{ needs.version.outputs.channel == 'beta' }}
          # Emits `latest.json` alongside the bundles and merges each matrix
          # row's platform entry into it. Without this the updater plugin has
          # a public key, a signature and nothing to fetch (ADR 0042).
          includeUpdaterJson: true
          args: --target ${{ matrix.target }} --features ${{ matrix.features }}

  # The beta channel needs its own manifest at a stable URL, and GitHub has no
  # "newest release including prereleases" download link. So the manifest this
  # run produced is copied onto a rolling `beta` release, which is the only
  # thing beta clients ever fetch.
  beta-manifest:
    needs: [guard, version, build]
    if: needs.guard.outputs.proceed == 'true' && needs.version.outputs.channel == 'beta'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish the manifest to the beta channel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          gh release download "${TAG}" --pattern latest.json --output beta.json --clobber
          # `beta` is a rolling pointer, not a version: it is recreated on the
          # default branch every time so its single asset is always the newest
          # prerelease manifest. Marked prerelease itself so it can never be
          # mistaken for the latest stable release.
          if ! gh release view beta >/dev/null 2>&1; then
            gh release create beta               --title "Beta channel"               --notes "Rolling update manifest for clients configured with [updates] channel = \"beta\". Not a release; see the tagged releases for artifacts."               --prerelease               --target "${GITHUB_SHA}"
          fi
          gh release upload beta beta.json --clobber
          echo "beta channel now points at ${TAG}"
