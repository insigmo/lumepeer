# Resource budget gate (design doc §15, §16.2, §19 phase 5).
#
# Runs on a self-hosted runner pinned to the reference configuration: 4 vCPU,
# 8 GiB RAM, no discrete GPU. Exceeding a threshold fails the release gate; it
# is never downgraded to a warning. Relaxing a threshold needs an ADR with an
# explicit release-owner sign-off.
#
# Not wired into .github/workflows yet: it activates in phase 5, once there is
# something to measure beyond the skeleton.

reference_hardware:
  vcpu: 4
  ram_gib: 8
  discrete_gpu: false

tooling:
  linux: [heaptrack, "valgrind massif"]
  macos: [instruments]
  windows: [etw]

budgets:
  # Every value mirrors a constant or a row of §15. Changing one here without
  # changing the design doc text is itself a defect (§2.7).
  idle_rss_mib:
    target: 60 # IDLE_RAM_BUDGET_MIB
    gate_p95: 70
  idle_cpu_percent:
    target: 0.5
    gate_p95: 1.0
  active_extra_rss_mib:
    target: 150 # ACTIVE_SESSION_EXTRA_RAM_BUDGET_MIB
    gate_p95: 180
    # What MAX_STREAM_PIXELS costs against this number, measured as
    # arithmetic on the buffers the host actually holds (ADR 0074). On the
    # readback capture path a session holds one BGRA frame, the cursor-free
    # copy of it, and the NV12 conversion buffer:
    #   1920x1080  ->  7.9 +  7.9 + 3.0 =  18.8 MiB
    #   3840x2160  -> 31.6 + 31.6 + 11.9 =  75.1 MiB
    #   5120x2880  -> 56.3 + 56.3 + 21.1 = 133.7 MiB
    # 5K is the ceiling MAX_STREAM_PIXELS now allows, and on the readback
    # path it leaves 16 MiB of this budget for the whole rest of the session.
    # A host reaches that size inside the budget only with the zero-copy path
    # of ADR 0073, where all three are GPU textures and none of them is
    # resident here. 8K would be 534 MiB and is why MAX_STREAM_PIXELS is not
    # 7680x4320: the budget is the answer, not the thing to raise.
  active_cpu_percent:
    target_range: [5, 15]
    gate_p95: 20
  glass_to_glass_lan_ms:
    target: 120
    gate_p95: 150
  glass_to_glass_wan_ms:
    target: 250
    gate_p95: 350
  input_rtt_lan_ms:
    target: 100
    gate_p95: 150
  input_rtt_wan_ms:
    target: 200
    gate_p95: 300
  connection_established_lan_s:
    target: 2
    gate_p95: 3
  connection_established_wan_s:
    target: 5
    gate_p95: 8
