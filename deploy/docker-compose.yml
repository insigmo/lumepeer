version: "3.8"

# Self-hosted Iroh relay for Lumepeer (docs/relay-deployment.md).
#
# The relay is dumb by design: it only forwards encrypted QUIC packets
# between peers that already know each other's public keys, so hosting one
# adds availability, never trust (§7). This compose file runs the official
# `iroh-relay` image with production flags:
#
#   --dev off                 refuse to run without TLS certs (production mode)
#   --hostname $RELAY_HOST    DNS name the cert is requested for
#   --cert-mode acme          Let's Encrypt via the HTTP-01 challenge, which
#                             is why port 80 must be reachable from outside
#   --http-request-limit ...  bound per-request size; the relay is not a file server
#
# What you must set (in a .env file next to this compose file, gitignored):
#   RELAY_HOST=relay.example.com     DNS A/AAAA record pointing at this host
#   RELAY_CONTACT=admin@example.com  abuse/contact shown in relay responses
#
# Open in the firewall: 80/tcp (ACME challenge), 443/tcp (client relaying).
# Nothing else needs exposing; hosts and guests talk P2P once hole punching
# succeeds and only fall back to this relay when they cannot.

services:
  iroh-relay:
    image: n0computer/iroh-relay:v0.90.0
    container_name: lumepeer-relay
    restart: unless-stopped
    ports:
      - "80:80/tcp"     # ACME HTTP-01 challenge only
      - "443:443/tcp"   # relayed client traffic over TLS
    volumes:
      - relay-data:/data
    environment:
      - RELAY_HOST=${RELAY_HOST:?set RELAY_HOST in .env}
      - RELAY_CONTACT=${RELAY_CONTACT:-}
    command:
      - "--dev"
      - "off"
      - "--hostname"
      - "${RELAY_HOST}"
      - "--cert-mode"
      - "acme"
      - "--acme-domains"
      - "${RELAY_HOST}"
      - "--contact"
      - "${RELAY_CONTACT}"

volumes:
  relay-data:
