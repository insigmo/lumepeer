# Self-hosted Iroh relay for Lumepeer (docs/relay-deployment.md).
#
# The relay is dumb by design: it only forwards encrypted QUIC packets
# between peers that already know each other's public keys, so hosting one
# adds availability, never trust (§7).
#
# The image tag tracks the `iroh = "=1.0.2"` pin of the workspace manifest,
# and moving one without the other is a protocol mismatch, not a version
# skew: a 0.9x relay does not serve 1.0 clients at all. Bump both in the same
# PR, the way §5 treats every other iroh pin.
#
# Configuration is a file, not flags. The 1.0 relay binary takes exactly two
# arguments — `--dev` and `--config-path` — so everything to set lives in
# `relay.toml` next to this file: the hostname whose DNS record points here,
# the ACME contact address, and the per-client limits.
#
# Open in the firewall: 80/tcp (ACME challenge), 443/tcp (client relaying),
# 7842/udp (QUIC address discovery — this is what tells a peer how the world
# sees it, which is what makes hole punching succeed and keeps sessions off
# the relay in the first place). Nothing else needs exposing.

services:
  iroh-relay:
    image: n0computer/iroh-relay:v1.0.2
    container_name: lumepeer-relay
    restart: unless-stopped
    ports:
      - "80:80/tcp" # ACME HTTP-01 challenge only
      - "443:443/tcp" # relayed client traffic over TLS
      - "7842:7842/udp" # QUIC address discovery
    volumes:
      - relay-data:/data
      - ./relay.toml:/config/relay.toml:ro
    command:
      - "--config-path"
      - "/config/relay.toml"
    healthcheck:
      # With TLS configured, port 80 keeps serving only the captive-portal
      # probe; `/ping` lives on the HTTPS socket. `/generate_204` is therefore
      # the one check that needs no certificate.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/generate_204"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  relay-data:
